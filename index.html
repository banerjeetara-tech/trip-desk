<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Desk</title>
<meta name="theme-color" content="#C2410C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
:root{--bg:#FFF3EA;--sf:#FFFFFF;--sf2:#FFF8F3;--ln:#F0D9C9;--ink:#2B1710;--mu:#6A4B3C;--ac:#C2410C;--onac:#FFFFFF;--so:#FFE2CF;--si:#7C2D0A;--wb:#FFF0C2;--wi:#6B4A00;--bd:#FBD9D3;--bi:#8A1C1C;color-scheme:light}
:root[data-theme="midnight"]{--bg:#0D1424;--sf:#16213A;--sf2:#1E2B4A;--ln:#2A3A5E;--ink:#F2F5FB;--mu:#A9B6D0;--ac:#FF8A4C;--onac:#1A0E05;--so:#3B2C2A;--si:#FFC9A8;--wb:#3A3320;--wi:#FFD76A;--bd:#4A1F2A;--bi:#FFB4C0;color-scheme:dark}
:root[data-theme="daylight"]{--bg:#F4F6FB;--sf:#FFFFFF;--sf2:#F1F3FA;--ln:#DDE2EE;--ink:#101828;--mu:#475467;--ac:#4F46E5;--onac:#FFFFFF;--so:#E6E7FD;--si:#2B2785;--wb:#FDF0D5;--wi:#7A4A06;--bd:#FDE4E4;--bi:#8A1C1C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ac)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.brand{font-family:Sora,Manrope,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
nav{flex:none;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer}
nav button[aria-current="page"]{color:var(--ac)}
nav .ico{font-size:20px;line-height:1}
h1{margin:4px 0 0;font-family:Sora,Manrope,sans-serif;font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{margin:0;font-family:Sora,Manrope,sans-serif;font-size:17px}
h3{margin:0;font-size:15px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border-color:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.line{border-top:1px solid var(--ln);padding-top:10px}
label{font-size:13px;font-weight:700;color:var(--mu)}
.inp{height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;background:var(--sf2);width:100%;min-width:0}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font-weight:700;cursor:pointer;padding:0 16px}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-weight:700;cursor:pointer;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer;font-size:18px}
.ibtn:disabled{opacity:.35;cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--so);color:var(--si);white-space:nowrap}
.chip.warn{background:var(--wb);color:var(--wi)}.chip.bad{background:var(--bd);color:var(--bi)}.chip.plain{background:var(--sf2);color:var(--mu)}
.segs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px}
.segs button{flex:1;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--mu);font-weight:700;cursor:pointer;padding:0 6px}
.segs button[aria-pressed="true"]{background:var(--ac);color:var(--onac)}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);font-weight:700;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ac);background:var(--so);color:var(--si)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--ln);background:var(--sf2);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ac);background:var(--so)}
.num{width:28px;height:28px;border-radius:14px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.hero{background:var(--ac);color:var(--onac);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:Sora,Manrope,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.banner{background:var(--so);color:var(--si);border-radius:14px;padding:12px 14px;font-weight:500}
.warnbox{background:var(--wb);color:var(--wi);border-radius:12px;padding:10px 12px}
.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--sf2)}
.thumb{flex:none;width:96px;height:72px;border-radius:12px;object-fit:cover;background:var(--so);display:flex;align-items:center;justify-content:center;font-size:34px}
.bar{height:12px;border-radius:6px;background:var(--sf2);overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.months{display:flex;align-items:flex-end;gap:4px;height:70px}
.months>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:70px;font-size:11px;color:var(--mu)}
.months span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--so)}
.months span.on{background:var(--ac)}
.switch{flex:none;position:relative;width:52px;height:32px;border-radius:16px;border:0;cursor:pointer;background:var(--ln)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--mu);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--ac)}.switch[aria-pressed="true"]::after{left:23px;background:var(--onac)}
.check{min-height:48px;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;width:100%}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;color:var(--onac);font-size:14px}
.check[aria-pressed="true"] .box{background:var(--ac);border-color:var(--ac)}
details summary{cursor:pointer;font-weight:700;min-height:32px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--ln);padding-top:8px}
.kv>:last-child{font-weight:700;text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Trip Desk</div>
    <button class="ibtn" id="gear" type="button" aria-label="Settings and saved plans">⚙️</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Sections"></nav>
</div>
<script>
'use strict';
/* ============================================================
   Trip Desk: free-first trip planner.
   Live data with no API key: Open-Meteo, Wikivoyage, Wikipedia,
   Wikimedia Commons, REST Countries, open.er-api.com, Bing News (via your proxy).
   Claude is used only by the "Check my plan" button, through your Apps Script backend.
   ============================================================ */

const LS = 'tripdesk.v1', LSR = 'tripdesk.research.v1', LSV = 'tripdesk.visa.v1';
const enc = encodeURIComponent;
const DAY = 86400000;

function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return isoOf(d); }
function todayIso() { return isoOf(new Date()); }
function nice(s, opt) { return parseIso(s).toLocaleDateString('en-GB', opt || { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-IN'); }
function fmtH(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function keyOf(name) { return norm(name); }
function slug(s) { return norm(s).replace(/ /g, '-'); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- state ---------- */
const DEFAULTS = {
  tab: 'plan', back: 'plan', rsub: 'legs', dsub: 'plan', wsub: 'exp', lstop: 0, banner: '',
  settings: {
    theme: 'sunset', home: { name: 'Kolkata', lat: 22.5726, lng: 88.3639, cc: 'IN', country: 'India' }, passport: 'India',
    food: 'both', budget: 'comfort', cap: 200000, wtemp: 'warm', wrain: 'mid',
    proxy: 'https://youtubenews.banerjee-tara.workers.dev/?url=', backend: '', passcode: ''
  },
  trip: { name: '', stops: [], start: addDays(todayIso(), 45), travellers: 2, free: false, legModes: {}, swaps: {}, over: {}, seed: 1, extra: {}, skip: {}, must: {} },
  wdate: '', wstop: 0, people: ['You', 'Partner'], payer: 0, expenses: [], docs: {}, plans: [],
  check: null, meterLog: []
};
let S = load(LS, DEFAULTS);
let R = load(LSR, {});              // research per place key
let V = load(LSV, null);            // visa table cache
let RATES = null;                   // {at, rates} per INR
const busy = {};                    // key -> {source: true}
const mem = { wx: {}, photos: {}, news: {} };

function load(k, def) {
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return structuredClone(def);
    const v = JSON.parse(raw);
    if (def && typeof def === 'object' && !Array.isArray(def)) return deepMerge(structuredClone(def), v);
    return v;
  } catch (e) { return def === null ? null : structuredClone(def); }
}
function deepMerge(a, b) {
  Object.keys(b || {}).forEach((k) => {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
    else a[k] = b[k];
  });
  return a;
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  try { localStorage.setItem(LSR, JSON.stringify(R)); } catch (e) { pruneResearch(); }
}
function pruneResearch() {
  const keep = new Set(S.trip.stops.map((s) => s.key));
  Object.keys(R).forEach((k) => { if (!keep.has(k)) delete R[k]; });
  try { localStorage.setItem(LSR, JSON.stringify(R)); } catch (e) {}
}
function set(fn) { fn(S); save(); render(); }

/* ---------- DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    el.append(c.nodeType ? c : String(c));
  });
  return el;
}
function ext(url, label, cls) {
  if (!/^https?:\/\//i.test(String(url || ''))) return h('span', {}, label || '');
  return h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', class: cls || '' }, label || url);
}
function segs(items, cur, onPick) {
  return h('div', { class: 'segs' }, items.map(([v, l]) => h('button', { type: 'button', 'aria-pressed': String(cur === v), onclick: () => onPick(v) }, l)));
}
function chip(text, tone) { return h('span', { class: 'chip ' + (tone || '') }, text); }
function sw(on, label, onClick) { return h('button', { type: 'button', class: 'switch', 'aria-pressed': String(!!on), 'aria-label': label, onclick: onClick }); }
function stepper(label, value, onMinus, onPlus) {
  return h('div', { class: 'row' },
    h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Less ' + label, onclick: onMinus }, '−'),
    h('div', { class: 'b', style: 'min-width:96px;text-align:center' }, value),
    h('button', { type: 'button', class: 'ibtn', 'aria-label': 'More ' + label, onclick: onPlus }, '+'));
}

/* ---------- network ---------- */
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}
async function getText(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}

/* ---------- places: geocoding ---------- */
async function geocode(input) {
  const parts = String(input).split(',').map((s) => s.trim()).filter(Boolean);
  const name = parts[0], hint = norm(parts.slice(1).join(' '));
  const home = S.settings.home && S.settings.home.cc;
  // 1) Wikipedia knows common spellings, states and regions (Kanyakumari, Kerala, Munnar…)
  const wikiP = wikiPlace(input).catch(() => null);
  // 2) Open-Meteo geocoding gives exact towns with country codes
  const omP = getJSON('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name=' + enc(name))
    .then((j) => (j.results || []).map((r) => ({ name: r.name, lat: r.latitude, lng: r.longitude, cc: (r.country_code || '').toUpperCase(), country: r.country || '', admin1: r.admin1 || '', pop: r.population || 0 })))
    .catch(() => []);
  const [wiki, om0] = await Promise.all([wikiP, omP]);
  let om = om0;
  if (hint) { const f = om.filter((r) => norm(r.country + ' ' + r.admin1).includes(hint)); if (f.length) om = f; }
  om.sort((a, b) => (b.cc === home) - (a.cc === home) || b.pop - a.pop);
  const res = [];
  if (wiki) res.push(wiki);
  om.forEach((r) => { if (!res.some((x) => hav(x, r) < 25)) res.push(r); });
  // If Wikipedia found it, keep Open-Meteo matches only when they are in the same country (avoids "Kerälä, Finland" for Kerala)
  if (wiki && wiki.cc) return res.filter((r, i) => i === 0 || r.cc === wiki.cc);
  return res;
}
async function wikiPlace(input) {
  const W = 'https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1&prop=coordinates|pageprops&ppprop=wikibase_item|disambiguation';
  let j = await getJSON(W + '&action=query&titles=' + enc(input.trim().replace(/^\w/, (c) => c.toUpperCase())), 12000);
  let pg = j.query && j.query.pages && j.query.pages[0];
  if (!pg || pg.missing || !pg.coordinates || (pg.pageprops && 'disambiguation' in pg.pageprops)) {
    j = await getJSON(W + '&action=query&generator=search&gsrlimit=1&gsrsearch=' + enc(input), 12000);
    pg = j.query && j.query.pages && j.query.pages[0];
  }
  if (!pg || !pg.coordinates || !pg.coordinates[0]) return null;
  const out = { name: pg.title.replace(/\s*\(.*\)$/, '').split(',')[0], lat: pg.coordinates[0].lat, lng: pg.coordinates[0].lon, cc: '', country: '', admin1: '', wiki: pg.title };
  const qid = pg.pageprops && pg.pageprops.wikibase_item;
  try {
    if (!qid) throw new Error('no item');
    const sparql = 'SELECT ?iso ?cl ?al WHERE { wd:' + qid + ' wdt:P17 ?c . ?c wdt:P297 ?iso . OPTIONAL { wd:' + qid + ' wdt:P131 ?a . ?a rdfs:label ?al . FILTER(LANG(?al)="en") } ?c rdfs:label ?cl . FILTER(LANG(?cl)="en") } LIMIT 1';
    const q = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + enc(sparql), 12000);
    const b = q.results && q.results.bindings && q.results.bindings[0];
    if (!b) throw new Error('no country');
    out.cc = b.iso.value.toUpperCase(); out.country = b.cl.value; out.admin1 = b.al ? b.al.value : '';
  } catch (e) {
    try {
      const r = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude=' + out.lat + '&longitude=' + out.lng, 10000);
      out.cc = (r.countryCode || '').toUpperCase(); out.country = r.countryName || ''; out.admin1 = r.principalSubdivision || '';
    } catch (e2) {}
  }
  return out;
}
function hav(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(x));
}

/* ---------- Wikivoyage ---------- */
const WV = 'https://en.wikivoyage.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1';
const WANT = {
  understand: /^understand/i, getin: /^get in/i, getaround: /^get around/i, see: /^see\b/i, do: /^do\b/i,
  eat: /^eat\b/i, sleep: /^sleep\b/i, safe: /^stay (safe|healthy)/i, cities: /^cities\b/i, other: /^other destinations/i
};
async function wvParseSections(title) {
  const j = await getJSON(WV + '&action=parse&prop=sections&page=' + enc(title));
  if (j.error || !j.parse) throw new Error((j.error && j.error.info) || 'missing');
  return j.parse;
}
async function wvFind(stop) {
  const tries = [stop.name, stop.geo && stop.geo.name].filter(Boolean);
  for (const t of tries) { try { return await wvParseSections(t); } catch (e) {} }
  const s = await getJSON(WV + '&action=opensearch&limit=3&search=' + enc(stop.geo ? stop.geo.name : stop.name));
  const t = s && s[1] && s[1][0];
  if (!t) throw new Error('No Wikivoyage page for this place');
  return wvParseSections(t);
}
function cleanDoc(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('style,script,sup,.mw-editsection,.noprint,.listing-metadata,.listing-coordinates,.geo,.mw-references-wrap,.reference,.navbox,.thumb,figure,.mw-kartographer-maplink,.listing-sister-icons,.pagebanner,.mw-empty-elt').forEach((n) => n.remove());
  return d;
}
function txt(n) { return (n && n.textContent || '').replace(/\s+/g, ' ').replace(/\s([,.;:])/g, '$1').trim(); }
function listItems(d, max) {
  const out = [], seen = new Set();
  d.querySelectorAll('li').forEach((li) => {
    if (li.closest('.toc')) return;
    const t = txt(li);
    if (t.length < 12) return;
    const nEl = li.querySelector('.listing-name, .fn, b');
    const first = li.firstElementChild;
    let name = nEl ? txt(nEl) : (first && /^(A|STRONG|SPAN)$/.test(first.tagName) && t.startsWith(txt(first)) ? txt(first) : '');
    if (!name || name.length > 80) name = t.split(/[.:—–(]/)[0].slice(0, 70).trim();
    const k = norm(name);
    if (!k || seen.has(k)) return;
    seen.add(k);
    const pEl = li.querySelector('.listing-price');
    let body = t.startsWith(name) ? t.slice(name.length).replace(/^[\s,.:;—–-]+/, '') : t;
    if (!body) body = t;
    out.push({ name, text: body.slice(0, 340), price: pEl ? txt(pEl) : '' });
  });
  return out.slice(0, max || 14);
}
function paragraphs(d, max) { return [...d.querySelectorAll('p')].map(txt).filter((t) => t.length > 40).slice(0, max || 4); }

const MODES = [
  ['Tuk-tuk', /tuk[\s-]?tuks?/i, '🛺'], ['Auto-rickshaw', /auto[\s-]?rickshaws?|\bautos\b/i, '🛺'], ['Cycle rickshaw', /cycle[\s-]?rickshaws?|pedicabs?|becaks?/i, '🚲'],
  ['Motorbike taxi', /motorbike taxis?|motorcycle taxis?|bike taxis?|ojek/i, '🏍️'], ['Ride-hailing apps', /\b(grab|gojek|uber|ola cabs|\bola\b|bolt|rapido|careem|lyft)\b/i, '📱'],

async function fetchClimate(geo) {
  const y = new Date().getFullYear() - 1;
  const j = await getJSON('https://archive-api.open-meteo.com/v1/archive?latitude=' + geo.lat + '&longitude=' + geo.lng + '&start_date=' + y + '-01-01&end_date=' + y + '-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto', 25000);

async function rangeWeather(geo, from, to) {
  const key = geo.lat + ',' + geo.lng + '|' + from + '|' + to;

  let days = [];
  if (ahead <= 15 && (parseIso(from) - parseIso(todayIso())) / DAY >= 0) {
    const j = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + geo.lat + '&longitude=' + geo.lng + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=' + from + '&end_date=' + to);

      const a = acc[s.slice(5)];
      days.push(a && a.n ? { date: s, tmax: Math.round(a.tx / a.n), tmin: Math.round(a.tn / a.n), rain: Math.round(a.wet / a.n * 100), kind: 'Typical for this date (last ' + a.n + ' years)' } : { date: s, tmax: null, tmin: null, rain: null, kind: 'No data' });

function bestOrder() {
  const st = S.trip.stops;
  if (st.length < 2) return set((s) => { s.banner = 'Add at least two places to find a better order.'; });
  if (st.some((s) => !s.geo)) return set((s) => { s.banner = 'Research the places first so I know where they are.'; });
  if (st.length > 7) return set((s) => { s.banner = 'Best order works for up to 7 places.'; });
  const home = homePt();
  const total = (arr) => { const p = [home].concat(arr.map(stopPt), [home]); let t = 0; for (let i = 0; i < p.length - 1; i++) t += hav(p[i], p[i + 1]); return t * 1.3; };
  let best = null, bestT = Infinity;
  const perm = (rest, cur) => {
    if (!rest.length) { const t = total(cur); if (t < bestT - 0.001) { bestT = t; best = cur; } return; }
    rest.forEach((x, i) => perm(rest.slice(0, i).concat(rest.slice(i + 1)), cur.concat([x])));
  };
  perm(st, []);
  const now = total(st);
  set((s) => {
    if (bestT >= now - 5) { s.banner = 'Your order is already the shortest loop from home and back.'; return; }
    s.trip.stops = best; s.trip.swaps = {};
    s.banner = 'Re-ordered: ' + best.map(shortName).join(', ') + '. Saves about ' + fmt(now - bestT) + ' km. Legs, costs and days re-planned.';
  });
}

const RATE_CARD = {
  IN: { stay: [1800, 3500, 8000], food: [1000, 1800, 3500], local: [500, 800, 1500], act: [400, 900, 2000] },
  XX: { stay: [2500, 5500, 12000], food: [1500, 3000, 6000], local: [700, 1200, 2500], act: [700, 1500, 3000] }
};
function tierIdx() { return { budget: 0, comfort: 1, premium: 2 }[S.settings.budget]; }
function stopRates(s) {
  const card = s.geo && s.geo.cc === 'IN' ? RATE_CARD.IN : RATE_CARD.XX;
  const o = S.trip.over[s.key] || {};
  const t = tierIdx();
  const mul = S.trip.travellers <= 2 ? 1 : S.trip.travellers / 2;
  return {
    stay: o.stay != null ? o.stay : Math.round(card.stay[t] * Math.ceil(S.trip.travellers / 2)),
    food: o.food != null ? o.food : Math.round(card.food[t] * mul),

  };
}
function costs() {
  const c = { transit: 0, stay: 0, food: 0, local: 0, act: 0, visa: 0 };
  S.trip.stops.forEach((s) => { const r = stopRates(s); c.stay += r.stay * s.nights; c.food += r.food * s.nights; c.local += r.local * s.nights; c.act += r.act * s.nights; });
  legs().forEach((l) => { c.transit += l.sel.fare * S.trip.travellers; });

/* ---------- itinerary (rule-based) ---------- */
function dietOk(text) {
  const veg = /\b(vegetarian|vegan|pure veg|veg\b|thali|dosa|idli|sadya|paneer|tofu)\b/i.test(text);
  const non = /\b(chicken|fish|seafood|pork|beef|mutton|meat|prawns?|crab|lamb|duck|biryani|kebab|steak)\b/i.test(text);
  const f = S.settings.food;
  if (f === 'veg') return veg || !non;
  if (f === 'nonveg') return non || !veg;
  return true;
}
function foodTag(text) {
  const veg = /\b(vegetarian|vegan|pure veg|veg\b)\b/i.test(text);
  const non = /\b(chicken|fish|seafood|pork|beef|mutton|meat|prawns?|crab|lamb|duck|biryani|kebab|steak)\b/i.test(text);
  return veg && !non ? ['Veg', ''] : non && !veg ? ['Non-veg', 'warn'] : ['Veg or non-veg', 'plain'];
}
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(list, seed, salt) {
  const arr = list.slice();
  if (!seed || seed === 1) return arr;
  let hsh = 0; for (const ch of salt) hsh = (hsh * 31 + ch.charCodeAt(0)) | 0;
  const rnd = seeded(seed ^ hsh);
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function differentPlan() {
  set((s) => { s.trip.seed = 2 + Math.floor(Math.random() * 1e9); s.trip.swaps = {}; s.banner = 'Here is a different plan: new sights and food for each day. Tap again for another.'; });
}
function itinerary() {
  const L = legs(), dates = stopDates(), days = [];
  const T = S.trip, skip = T.skip || {}, extra = T.extra || {};
  S.trip.stops.forEach((s, i) => {
    const v = (R[s.key] && R[s.key].voyage) || {};
    const skipped = new Set(skip[s.key] || []);
    const base = (v.see || []).concat(v.do || []).filter((x) => !skipped.has(x.name));
    const must = ((T.must || {})[s.key] || []).filter((n) => !skipped.has(n));
    const mustItems = must.map((n) => base.find((x) => x.name === n) || { name: n, text: '' });
    const pool = mustItems.concat(shuffled(base.filter((x) => !must.includes(x.name)), T.seed, s.key + 'see'));
    const eats = shuffled((v.eat || []).filter((e) => dietOk(e.text) && !skipped.has(e.name)), T.seed, s.key + 'eat');
    for (let d = 0; d < s.nights; d++) {
      const items = [];
      if (d === 0 && L[i]) items.push({ tag: 'Travel', title: L[i].a.name + ' to ' + L[i].b.name + ' by ' + L[i].sel.label.toLowerCase() + ', about ' + fmtH(L[i].sel.hrs), price: L[i].sel.fare * S.trip.travellers });
      const slots = d === 0 ? 1 : 2;
      for (let k = 0; k < slots; k++) {
        const sk = s.key + '|' + d + '|' + k;
        if (pool.length) {
          const idx = (d * 2 + k + (S.trip.swaps[sk] || 0)) % pool.length;
          items.push({ tag: 'See', title: pool[idx].name, text: pool[idx].text, price: null, swapKey: sk, canSwap: pool.length > 2, place: shortName(s), stopKey: s.key });
        } else if (k === 0) items.push({ tag: 'See', title: 'Explore ' + shortName(s), text: 'No sights listed on Wikivoyage. Tap "Check my plan" for ideas.', place: shortName(s) });
      }
      if (eats.length) { const e = eats[d % eats.length]; items.push({ tag: 'Eat', title: e.name, text: e.text, price: null, place: shortName(s), stopKey: s.key }); }
      const dayKey = s.key + '|' + d;
      (extra[dayKey] || []).forEach((x) => items.push({ tag: 'Mine', title: x.title, text: '', place: shortName(s), dayKey, mineId: x.id }));
      if (i === S.trip.stops.length - 1 && d === s.nights - 1 && L[i + 1]) items.push({ tag: 'Travel', title: L[i + 1].a.name + ' to ' + L[i + 1].b.name + ' by ' + L[i + 1].sel.label.toLowerCase() + ', about ' + fmtH(L[i + 1].sel.hrs), price: L[i + 1].sel.fare * S.trip.travellers });
      days.push({ date: addDays(dates[i].from, d), stop: s, dayKey, title: d === 0 ? 'Reach ' + shortName(s) : shortName(s) + ', day ' + (d + 1), items });
    }
  });
  return days;
}

  const on = !!S.docs[key];
  return h('button', { type: 'button', class: 'check', 'aria-pressed': String(on), onclick: () => set((s) => { s.docs[key] = !on; }) }, h('span', { class: 'box', 'aria-hidden': 'true' }, on ? '✓' : ''), h('span', {}, label));
}

/* ----- Wallet ----- */
function viewWallet() {
  const out = [h('h1', {}, 'Wallet'), segs([['exp', 'Expenses'], ['docs', 'Documents'], ['visa', 'Visa']], S.wsub, (v) => set((s) => { s.wsub = v; }))];
  if (S.wsub === 'exp') return out.concat(expensesView());
  if (S.wsub === 'docs') return out.concat(docsView());
  return out.concat(visaView());
}
function expensesView() {
  const n = S.people.length, spent = S.expenses.reduce((a, e) => a + e.amt, 0), share = n ? spent / n : 0;
  const paid = S.people.map((p, i) => S.expenses.filter((e) => e.by === i).reduce((a, e) => a + e.amt, 0));
  const net = paid.map((p) => p - share);
  const dv = net.map((v, i) => ({ i, v: -v })).filter((x) => x.v > 0.5).sort((a, b) => b.v - a.v);
  const cv = net.map((v, i) => ({ i, v })).filter((x) => x.v > 0.5).sort((a, b) => b.v - a.v);
  const settle = []; let a = 0, b = 0;
  while (a < dv.length && b < cv.length) { const m = Math.min(dv[a].v, cv[b].v); settle.push(S.people[dv[a].i] + ' pays ' + S.people[cv[b].i] + ' ₹' + fmt(m)); dv[a].v -= m; cv[b].v -= m; if (dv[a].v < 0.5) a++; if (cv[b].v < 0.5) b++; }
  const desc = h('input', { id: 'edesc', class: 'inp', type: 'text', placeholder: 'Dinner, taxi, tickets…' });
  const amt = h('input', { id: 'eamt', class: 'inp', inputmode: 'decimal', placeholder: '0' });
  const person = h('input', { id: 'eperson', class: 'inp', type: 'text', placeholder: 'Name' });
  return [
    h('div', { class: 'card' }, h('label', {}, 'Spent so far'), h('div', { class: 'b', style: 'font-family:Sora;font-size:30px' }, '₹' + fmt(spent)), h('div', { class: 'mu sm' }, 'Each person\'s share: ₹' + fmt(share)),
      S.people.map((p, i) => h('div', { class: 'kv' }, h('span', {}, h('b', {}, p), h('br'), h('span', { class: 'mu xs' }, 'Paid ₹' + fmt(paid[i]))), h('span', {}, chip(Math.abs(net[i]) < 1 ? 'Settled' : net[i] > 0 ? 'Gets back ₹' + fmt(net[i]) : 'Owes ₹' + fmt(-net[i]), net[i] < -0.5 ? 'warn' : '')))),
      h('div', { style: 'background:var(--sf2);border-radius:12px;padding:12px' }, h('label', {}, 'To settle up'), (settle.length ? settle : ['Everyone is settled up.']).map((t) => h('div', { class: 'b' }, t)))),
    h('div', { class: 'card' }, h('h2', {}, 'Add an expense'), h('label', { for: 'edesc' }, 'What was it'), desc, h('label', { for: 'eamt' }, 'Amount in rupees'), amt,
      h('label', {}, 'Who paid'), h('div', { class: 'row wrap' }, S.people.map((p, i) => h('button', { type: 'button', class: 'pill', 'aria-pressed': String(S.payer === i), onclick: () => set((s) => { s.payer = i; }) }, p))),
      h('button', { type: 'button', class: 'btn', onclick: () => { const v = Number(String(amt.value).replace(/[^0-9.]/g, '')); if (!v) return; set((s) => { s.expenses.push({ id: Date.now(), desc: desc.value.trim() || 'Expense', amt: v, by: s.payer }); }); } }, 'Add and split equally')),
    S.expenses.length ? h('div', { class: 'card' }, S.expenses.map((e) => h('div', { class: 'row line' }, h('div', { class: 'grow' }, h('div', { class: 'b' }, e.desc), h('div', { class: 'mu xs' }, 'Paid by ' + (S.people[e.by] || '?'))), h('div', { class: 'b' }, '₹' + fmt(e.amt)),
      h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Delete expense', onclick: () => set((s) => { s.expenses = s.expenses.filter((x) => x.id !== e.id); }) }, '×')))) : null,
    h('div', { class: 'card' }, h('h2', {}, 'Who is splitting'), h('div', { class: 'row' }, person, h('button', { type: 'button', class: 'btn2', onclick: () => { const nm = person.value.trim(); if (nm && !S.people.includes(nm)) set((s) => { s.people.push(nm); }); } }, 'Add')),
      h('div', { class: 'mu xs' }, 'Saved on this phone only.'))
  ];
}
function docsView() {
  const places = S.trip.stops.map(shortName);
  const q = (words) => 'https://mail.google.com/mail/u/0/#search/' + enc(words);
  const pl = places.length ? ' (' + places.map((p) => '"' + p + '"').join(' OR ') + ')' : '';
  const rows = [
    ['Flight tickets', 'from:(indigo OR airindia OR vistara OR spicejet OR akasaair OR makemytrip OR goibibo OR cleartrip OR ixigo) (ticket OR "booking confirmed" OR itinerary)' + pl],
    ['Train tickets', 'from:(irctc) (ERS OR "e-ticket" OR booked)'],
    ['Bus tickets', 'from:(redbus OR abhibus) ticket'],
    ['Hotel bookings', 'from:(agoda OR booking.com OR makemytrip OR goibibo OR airbnb OR oyo) (confirmation OR booking OR reservation)' + pl],
    ['Tours and tickets', 'from:(klook OR getyourguide OR viator) (voucher OR booking)'],
    ['Travel insurance', '(insurance) (travel) (policy) newer_than:1y'],
    ['Visa', '(visa OR e-visa OR evisa) (approved OR grant OR application) newer_than:1y']
  ];
  return [h('div', { class: 'card' }, h('h2', {}, 'Before you go'),
      ['Passport or photo ID for every traveller', 'Tickets for every leg', 'Hotel booking for every place', 'Travel insurance', 'Visa or e-visa, if needed', 'Forex card or cash'].map((d) => checkRow('doc:' + d, d))),
    h('div', { class: 'card' }, h('h2', {}, 'Find in Gmail'), h('div', { class: 'mu sm' }, 'Opens a Gmail search for each kind of booking. Nothing is read by this app.'),
      rows.map(([t, qq]) => h('div', { class: 'line row' }, h('div', { class: 'grow b' }, t), ext(q(qq), 'Search', 'btn2'))))];
}
function visaView() {
  const intl = S.trip.stops.filter((s) => s.geo && s.geo.cc && s.geo.cc !== S.settings.home.cc);
  const out = [];
  if (!S.trip.stops.length) return [empty()];
  if (!intl.length) return [h('div', { class: 'card' }, h('h2', {}, 'No visa needed'), h('div', {}, 'All your places are in ' + (S.settings.home.country || 'your home country') + '. Carry a government photo ID; trains check ID on board.'))];
  if (!isIndianPassport()) return [h('div', { class: 'card' }, h('h2', {}, 'Visa'), h('div', {}, 'Automatic visa lookup works for Indian passports. For ' + S.settings.passport + ', use the official links below.'), intl.map((s) => ext('https://www.google.com/search?q=' + enc(s.geo.country + ' visa ' + S.settings.passport + ' citizens official'), s.geo.country + ' visa rules', 'btn2')))];
  if (!V) {
    if (mem.visaErr) return [h('div', { class: 'card' }, h('div', { class: 'warnbox' }, 'Could not load visa rules: ' + mem.visaErr), h('button', { type: 'button', class: 'btn2', onclick: () => { mem.visaErr = ''; render(); } }, 'Try again'))];
    if (!mem.visaLoading) { mem.visaLoading = true; ensureVisaTable().catch((e) => { mem.visaErr = e.message; }).finally(() => { mem.visaLoading = false; render(); }); }
    return [h('div', { class: 'card' }, h('div', {}, h('span', { class: 'spin' }), ' Loading visa rules…'))];
  }
  const seen = new Set();
  intl.forEach((s) => {
    if (seen.has(s.geo.country)) return; seen.add(s.geo.country);
    const v = visaFor(s.geo.country);
    out.push(h('div', { class: 'card' }, h('div', { class: 'row between' }, h('h2', {}, s.geo.country), chip('Indian passport', 'plain')),
      v ? [h('div', { class: 'kv' }, h('span', {}, 'Entry'), h('span', {}, v.req)), v.stay ? h('div', { class: 'kv' }, h('span', {}, 'Stay allowed'), h('span', {}, v.stay)) : null, v.notes ? h('div', { class: 'sm mu' }, v.notes) : null]
        : h('div', {}, 'Not found in the table. Check the official site.'),
      h('div', { class: 'warnbox sm' }, 'From Wikipedia, which can lag behind rule changes. Confirm on the official government site before booking.'),
      h('div', { class: 'row wrap' }, ext('https://en.wikipedia.org/wiki/Visa_requirements_for_Indian_citizens', 'Wikipedia table', 'btn2'), ext('https://www.google.com/search?q=' + enc(s.geo.country + ' official visa Indian citizens e-visa'), 'Official site search', 'btn2'))));
  });
  out.push(h('div', { class: 'card' }, h('h2', {}, 'Passport'), checkRow('doc:valid6', 'Passport valid for 6+ months after return'), checkRow('doc:pages', 'At least 2 blank pages')));
  return out;
}

/* ----- Settings ----- */
function viewSettings() {
  const st = S.settings;
  const home = h('input', { id: 'home', class: 'inp', value: st.home.name, onchange: async (e) => {
    const v = e.target.value.trim(); if (!v) return;
    try { const r = await geocode(v); if (!r.length) throw new Error('not found'); set((s) => { s.settings.home = { name: r[0].name, lat: r[0].lat, lng: r[0].lng, cc: r[0].cc, country: r[0].country }; s.banner = 'Home set to ' + r[0].name + ', ' + r[0].country + '.'; }); }
    catch (err) { set((s) => { s.banner = 'Could not find ' + v + '.'; }); }
  } });
  const fileIn = h('input', { type: 'file', accept: 'application/json', class: 'visually-hidden', id: 'imp', onchange: (e) => importPlans(e.target.files[0]) });
  return [
    h('button', { type: 'button', class: 'btn2', style: 'align-self:flex-start;border:0', onclick: () => go(S.back || 'plan') }, '‹ Back'),
    h('h1', {}, 'Settings'), bannerEl(),
    h('div', { class: 'card' }, h('h2', {}, 'Saved plans'), h('div', { class: 'mu sm' }, 'Each plan keeps its places, dates and choices on this phone.'),
      S.plans.map((p) => h('div', { class: 'line row' }, h('div', { class: 'grow' }, h('div', { class: 'b' }, p.name), h('div', { class: 'mu xs' }, p.meta)),
        h('button', { type: 'button', class: 'btn', onclick: () => set((s) => { s.trip = structuredClone(p.trip); s.tab = 'trip'; s.banner = 'Opened "' + p.name + '".'; }) }, 'Open'),
        h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Delete plan', onclick: () => set((s) => { s.plans = s.plans.filter((x) => x.id !== p.id); }) }, '×'))),
      h('button', { type: 'button', class: 'btn2', disabled: S.trip.stops.length ? null : true, onclick: savePlan }, 'Save current plan'),
      h('div', { class: 'row wrap' }, h('button', { type: 'button', class: 'btn2', onclick: exportPlans }, 'Export to file'), h('label', { for: 'imp', class: 'btn2', style: 'font-size:15px' }, 'Import from file'), fileIn)),
    h('div', { class: 'card' }, h('h2', {}, 'Appearance'), segs([['sunset', 'Sunset'], ['midnight', 'Midnight'], ['daylight', 'Daylight']], st.theme, (v) => set((s) => { s.settings.theme = v; }))),
    h('div', { class: 'card' }, h('h2', {}, 'My defaults'),
      h('label', { for: 'home' }, 'Home city'), home, h('div', { class: 'mu xs' }, [st.home.name, st.home.country].filter(Boolean).join(', ')),
      h('label', { for: 'pp' }, 'Passport country'), h('input', { id: 'pp', class: 'inp', value: st.passport, onchange: (e) => set((s) => { s.settings.passport = e.target.value.trim() || 'India'; }) })),
    h('div', { class: 'card' }, h('h2', {}, 'Claude plan check'), h('div', { class: 'mu sm' }, 'Optional. Only used when you tap "Check my plan" on the Trip tab.'),
      h('label', { for: 'be' }, 'Apps Script web app URL'), h('input', { id: 'be', class: 'inp', value: st.backend, placeholder: 'https://script.google.com/macros/s/…/exec', onchange: (e) => set((s) => { s.settings.backend = e.target.value.trim(); }) }),
      h('label', { for: 'pc' }, 'Passcode'), h('input', { id: 'pc', class: 'inp', type: 'password', value: st.passcode, autocomplete: 'off', onchange: (e) => set((s) => { s.settings.passcode = e.target.value; }) }),
      h('button', { type: 'button', class: 'btn2', onclick: pingBackend }, 'Test connection'), meterBox()),
    h('div', { class: 'card' }, h('h2', {}, 'News proxy'), h('div', { class: 'mu sm' }, 'News feeds need a proxy, like your Brief app. Leave as is to use your existing Worker.'),
      h('label', { for: 'px' }, 'Proxy URL'), h('input', { id: 'px', class: 'inp', value: st.proxy, onchange: (e) => set((s) => { s.settings.proxy = e.target.value.trim(); }) })),
    h('div', { class: 'card' }, h('h2', {}, 'Data'), h('button', { type: 'button', class: 'btn2', onclick: () => { R = {}; V = null; try { localStorage.removeItem(LSV); } catch (e) {} set((s) => { s.banner = 'Research cache cleared. Tap "Research my trip" to fetch again.'; }); } }, 'Clear research cache'),
      h('div', { class: 'mu xs' }, 'Free sources: Wikivoyage and Wikipedia (CC BY-SA), Wikimedia Commons, Open-Meteo, REST Countries, open.er-api.com, Bing News.'))
  ];
}
function savePlan() {
  const n = totalNights();
  const name = S.trip.name || S.trip.stops.map(shortName).join(', ');
  set((s) => {
    s.plans = s.plans.filter((p) => p.name !== name).concat([{ id: Date.now(), name, meta: n + ' nights from ' + nice(s.trip.start) + ' · saved ' + new Date().toLocaleDateString('en-GB'), trip: structuredClone(s.trip) }]);
    s.banner = 'Saved "' + name + '".';
  });
}
function exportPlans() {
  const blob = new Blob([JSON.stringify({ app: 'trip-desk', version: 1, plans: S.plans, current: S.trip }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'trip-desk-plans.json' });
  document.body.append(a); a.click(); a.remove();
}
async function importPlans(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.plans)) throw new Error('Not a Trip Desk file');
    set((s) => { const names = new Set(s.plans.map((p) => p.name)); j.plans.forEach((p) => { if (p && p.trip && !names.has(p.name)) s.plans.push(p); }); s.banner = 'Imported ' + j.plans.length + ' plans.'; });
  } catch (e) { set((s) => { s.banner = 'Import failed: ' + e.message; }); }
}

/* ---------- start ---------- */
document.getElementById('gear').addEventListener('click', () => set((s) => { if (s.tab !== 'settings') s.back = s.tab; s.tab = 'settings'; }));
render();
ensureRates().then(render).catch(() => {});
if (S.trip.stops.some((s) => !s.geo || !(R[s.key] && R[s.key].voyage))) researchAll(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
