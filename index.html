<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Desk</title>
<meta name="theme-color" content="#C2410C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
:root{--bg:#FFF3EA;--sf:#FFFFFF;--sf2:#FFF8F3;--ln:#F0D9C9;--ink:#2B1710;--mu:#6A4B3C;--ac:#C2410C;--onac:#FFFFFF;--so:#FFE2CF;--si:#7C2D0A;--wb:#FFF0C2;--wi:#6B4A00;--bd:#FBD9D3;--bi:#8A1C1C;color-scheme:light}
:root[data-theme="midnight"]{--bg:#0D1424;--sf:#16213A;--sf2:#1E2B4A;--ln:#2A3A5E;--ink:#F2F5FB;--mu:#A9B6D0;--ac:#FF8A4C;--onac:#1A0E05;--so:#3B2C2A;--si:#FFC9A8;--wb:#3A3320;--wi:#FFD76A;--bd:#4A1F2A;--bi:#FFB4C0;color-scheme:dark}
:root[data-theme="daylight"]{--bg:#F4F6FB;--sf:#FFFFFF;--sf2:#F1F3FA;--ln:#DDE2EE;--ink:#101828;--mu:#475467;--ac:#4F46E5;--onac:#FFFFFF;--so:#E6E7FD;--si:#2B2785;--wb:#FDF0D5;--wi:#7A4A06;--bd:#FDE4E4;--bi:#8A1C1C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ac)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.brand{font-family:Sora,Manrope,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 96px;display:flex;flex-direction:column;gap:14px}
nav{flex:none;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer}
nav button[aria-current="page"]{color:var(--ac)}
nav .ico{font-size:20px;line-height:1}
h1{margin:4px 0 0;font-family:Sora,Manrope,sans-serif;font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{margin:0;font-family:Sora,Manrope,sans-serif;font-size:17px}
h3{margin:0;font-size:15px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border-color:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.line{border-top:1px solid var(--ln);padding-top:10px}
label{font-size:13px;font-weight:700;color:var(--mu)}
.inp{height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;background:var(--sf2);width:100%;min-width:0}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font-weight:700;cursor:pointer;padding:0 16px}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-weight:700;cursor:pointer;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer;font-size:18px}
.ibtn:disabled{opacity:.35;cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--so);color:var(--si);white-space:nowrap}
.chip.warn{background:var(--wb);color:var(--wi)}.chip.bad{background:var(--bd);color:var(--bi)}.chip.plain{background:var(--sf2);color:var(--mu)}
.segs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px}
.segs button{flex:1;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--mu);font-weight:700;cursor:pointer;padding:0 6px}
.segs button[aria-pressed="true"]{background:var(--ac);color:var(--onac)}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);font-weight:700;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ac);background:var(--so);color:var(--si)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--ln);background:var(--sf2);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ac);background:var(--so)}
.num{width:28px;height:28px;border-radius:14px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.hero{background:var(--ac);color:var(--onac);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:Sora,Manrope,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.banner{background:var(--so);color:var(--si);border-radius:14px;padding:12px 14px;font-weight:500}
.warnbox{background:var(--wb);color:var(--wi);border-radius:12px;padding:10px 12px}
.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--sf2)}
.thumb{flex:none;width:96px;height:72px;border-radius:12px;object-fit:cover;background:var(--so);display:flex;align-items:center;justify-content:center;font-size:34px}
.bar{height:12px;border-radius:6px;background:var(--sf2);overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.months{display:flex;align-items:flex-end;gap:4px;height:70px}
.months>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:70px;font-size:11px;color:var(--mu)}
.months span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--so)}
.months span.on{background:var(--ac)}
.switch{flex:none;position:relative;width:52px;height:32px;border-radius:16px;border:0;cursor:pointer;background:var(--ln)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--mu);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--ac)}.switch[aria-pressed="true"]::after{left:23px;background:var(--onac)}
.check{min-height:48px;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;width:100%}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;color:var(--onac);font-size:14px}
.check[aria-pressed="true"] .box{background:var(--ac);border-color:var(--ac)}
details summary{cursor:pointer;font-weight:700;min-height:32px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--ln);padding-top:8px}
.kv>:last-child{font-weight:700;text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));box-sizing:border-box;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:var(--onac);font-size:26px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Trip Desk</div>
    <div class="row" style="gap:8px">
      <button class="btn" id="install" type="button" hidden style="min-height:40px;padding:0 12px;font-size:14px">Install app</button>
      <button class="ibtn" id="gear" type="button" aria-label="Settings and saved plans">⚙️</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Sections"></nav>
</div>
<button class="fab" id="fab" type="button" aria-label="Quick actions: add a place, best order, compare plans">＋</button>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   Trip Desk: free-first trip planner.
   Live data with no API key: Open-Meteo, Wikivoyage, Wikipedia,
   Wikimedia Commons, REST Countries, open.er-api.com, Bing News (via your proxy).
   Claude is used only by the "Check my plan" button, through your Apps Script backend.
   ============================================================ */

const LS = 'tripdesk.v1', LSR = 'tripdesk.research.v1', LSV = 'tripdesk.visa.v1';
const enc = encodeURIComponent;
const DAY = 86400000;

function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return isoOf(d); }
function todayIso() { return isoOf(new Date()); }
function nice(s, opt) { return parseIso(s).toLocaleDateString('en-GB', opt || { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-IN'); }
function fmtH(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function keyOf(name) { return norm(name); }
function slug(s) { return norm(s).replace(/ /g, '-'); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- state ---------- */
const DEFAULTS = {
  tab: 'plan', back: 'plan', rsub: 'legs', dsub: 'plan', wsub: 'exp', lstop: 0, banner: '',
  settings: {
    theme: 'sunset', home: { name: 'Kolkata', lat: 22.5726, lng: 88.3639, cc: 'IN', country: 'India' }, passport: 'India',
    food: 'both', budget: 'comfort', cap: 200000, wtemp: 'warm', wrain: 'mid',
    proxy: 'https://youtubenews.banerjee-tara.workers.dev/?url=', backend: '', passcode: ''
  },
  trip: { name: '', stops: [], start: addDays(todayIso(), 45), travellers: 2, free: false, legModes: {}, swaps: {}, over: {}, seed: 1, extra: {}, skip: {}, must: {}, startAt: null, endMode: 'home', endAt: null, target: null, lock: false },
  wdate: '', wstop: 0, people: ['You', 'Partner'], payer: 0, expenses: [], docs: {}, plans: [],
  check: null, meterLog: []
};
let S = load(LS, DEFAULTS);
let R = load(LSR, {});              // research per place key
let V = load(LSV, null);            // visa table cache
let RATES = null;                   // {at, rates} per INR
const busy = {};                    // key -> {source: true}
const mem = { wx: {}, photos: {}, news: {} };

function load(k, def) {
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return structuredClone(def);
    const v = JSON.parse(raw);
    if (def && typeof def === 'object' && !Array.isArray(def)) return deepMerge(structuredClone(def), v);
    return v;
  } catch (e) { return def === null ? null : structuredClone(def); }
}
function deepMerge(a, b) {
  Object.keys(b || {}).forEach((k) => {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
    else a[k] = b[k];
  });
  return a;
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  try { localStorage.setItem(LSR, JSON.stringify(R)); } catch (e) { pruneResearch(); }
}
function pruneResearch() {
  const keep = new Set(S.trip.stops.map((s) => s.key));
  Object.keys(R).forEach((k) => { if (!keep.has(k)) delete R[k]; });
  try { localStorage.setItem(LSR, JSON.stringify(R)); } catch (e) {}
}
function set(fn) { fn(S); save(); render(); }

/* ---------- DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    el.append(c.nodeType ? c : String(c));
  });
  return el;
}
function ext(url, label, cls) {
  if (!/^https?:\/\//i.test(String(url || ''))) return h('span', {}, label || '');
  return h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', class: cls || '' }, label || url);
}
function segs(items, cur, onPick) {
  return h('div', { class: 'segs' }, items.map(([v, l]) => h('button', { type: 'button', 'aria-pressed': String(cur === v), onclick: () => onPick(v) }, l)));
}
function chip(text, tone) { return h('span', { class: 'chip ' + (tone || '') }, text); }
function sw(on, label, onClick) { return h('button', { type: 'button', class: 'switch', 'aria-pressed': String(!!on), 'aria-label': label, onclick: onClick }); }
function stepper(label, value, onMinus, onPlus) {
  return h('div', { class: 'row' },
    h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Less ' + label, onclick: onMinus }, '−'),
    h('div', { class: 'b', style: 'min-width:96px;text-align:center' }, value),
    h('button', { type: 'button', class: 'ibtn', 'aria-label': 'More ' + label, onclick: onPlus }, '+'));
}

/* ---------- network ---------- */
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}
async function getText(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}

/* ---------- places: geocoding ---------- */
async function geocode(input) {
  const parts = String(input).split(',').map((s) => s.trim()).filter(Boolean);
  const name = parts[0], hint = norm(parts.slice(1).join(' '));
  const home = S.settings.home && S.settings.home.cc;
  // 1) Wikipedia knows common spellings, states and regions (Kanyakumari, Kerala, Munnar…)
  const wikiP = wikiPlace(input).catch(() => null);
  // 2) Open-Meteo geocoding gives exact towns with country codes
  const omP = getJSON('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name=' + enc(name))
    .then((j) => (j.results || []).map((r) => ({ name: r.name, lat: r.latitude, lng: r.longitude, cc: (r.country_code || '').toUpperCase(), country: r.country || '', admin1: r.admin1 || '', pop: r.population || 0 })))
    .catch(() => []);
  const [wiki, om0] = await Promise.all([wikiP, omP]);
  let om = om0;
  if (hint) { const f = om.filter((r) => norm(r.country + ' ' + r.admin1).includes(hint)); if (f.length) om = f; }
  om.sort((a, b) => (b.cc === home) - (a.cc === home) || b.pop - a.pop);
  const res = [];
  if (wiki) res.push(wiki);
  om.forEach((r) => { if (!res.some((x) => hav(x, r) < 25)) res.push(r); });
  // If Wikipedia found it, keep Open-Meteo matches only when they are in the same country (avoids "Kerälä, Finland" for Kerala)
  if (wiki && wiki.cc) return res.filter((r, i) => i === 0 || r.cc === wiki.cc);
  return res;
}
async function wikiPlace(input) {
  const W = 'https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1&prop=coordinates|pageprops&ppprop=wikibase_item|disambiguation';
  let j = await getJSON(W + '&action=query&titles=' + enc(input.trim().replace(/^\w/, (c) => c.toUpperCase())), 12000);
  let pg = j.query && j.query.pages && j.query.pages[0];
  if (!pg || pg.missing || !pg.coordinates || (pg.pageprops && 'disambiguation' in pg.pageprops)) {
    j = await getJSON(W + '&action=query&generator=search&gsrlimit=1&gsrsearch=' + enc(input), 12000);
    pg = j.query && j.query.pages && j.query.pages[0];
  }
  if (!pg || !pg.coordinates || !pg.coordinates[0]) return null;
  const out = { name: pg.title.replace(/\s*\(.*\)$/, '').split(',')[0], lat: pg.coordinates[0].lat, lng: pg.coordinates[0].lon, cc: '', country: '', admin1: '', wiki: pg.title };
  const qid = pg.pageprops && pg.pageprops.wikibase_item;
  try {
    if (!qid) throw new Error('no item');
    const sparql = 'SELECT ?iso ?cl ?al WHERE { wd:' + qid + ' wdt:P17 ?c . ?c wdt:P297 ?iso . OPTIONAL { wd:' + qid + ' wdt:P131 ?a . ?a rdfs:label ?al . FILTER(LANG(?al)="en") } ?c rdfs:label ?cl . FILTER(LANG(?cl)="en") } LIMIT 1';
    const q = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + enc(sparql), 12000);
    const b = q.results && q.results.bindings && q.results.bindings[0];
    if (!b) throw new Error('no country');
    out.cc = b.iso.value.toUpperCase(); out.country = b.cl.value; out.admin1 = b.al ? b.al.value : '';
  } catch (e) {
    try {
      const r = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude=' + out.lat + '&longitude=' + out.lng, 10000);
      out.cc = (r.countryCode || '').toUpperCase(); out.country = r.countryName || ''; out.admin1 = r.principalSubdivision || '';
    } catch (e2) {}
  }
  return out;
}
function hav(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(x));
}

/* ---------- Wikivoyage ---------- */
const WV = 'https://en.wikivoyage.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1';
const WANT = {
  understand: /^understand/i, getin: /^get in/i, getaround: /^get around/i, see: /^see\b/i, do: /^do\b/i,
  eat: /^eat\b/i, sleep: /^sleep\b/i, safe: /^stay (safe|healthy)/i, cities: /^cities\b/i, other: /^other destinations/i, gonext: /^go next/i, districts: /^districts/i
};
async function wvParseSections(title) {
  const j = await getJSON(WV + '&action=parse&prop=sections&page=' + enc(title));
  if (j.error || !j.parse) throw new Error((j.error && j.error.info) || 'missing');
  return j.parse;
}
async function wvFind(stop) {
  const tries = [stop.name, stop.geo && stop.geo.name].filter(Boolean);
  for (const t of tries) { try { return await wvParseSections(t); } catch (e) {} }
  const s = await getJSON(WV + '&action=opensearch&limit=3&search=' + enc(stop.geo ? stop.geo.name : stop.name));
  const t = s && s[1] && s[1][0];
  if (!t) throw new Error('No Wikivoyage page for this place');
  return wvParseSections(t);
}
function cleanDoc(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('style,script,sup,.mw-editsection,.noprint,.listing-metadata,.listing-coordinates,.geo,.mw-references-wrap,.reference,.navbox,.thumb,figure,.mw-kartographer-maplink,.listing-sister-icons,.pagebanner,.mw-empty-elt').forEach((n) => n.remove());
  return d;
}

async function fetchClimate(geo) {
  const y = new Date().getFullYear() - 1;
  const j = await getJSON('https://archive-api.open-meteo.com/v1/archive?latitude=' + geo.lat + '&longitude=' + geo.lng + '&start_date=' + y + '-01-01&end_date=' + y + '-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto', 25000);

  (d.time || []).forEach((t, i) => {
    const m = months[+t.slice(5, 7) - 1];
    if (d.temperature_2m_max[i] == null) return;
    m.tmax += d.temperature_2m_max[i]; m.tmin += d.temperature_2m_min[i]; m.days++;
    if ((d.precipitation_sum[i] || 0) >= 1) m.rainDays++;
  });
  return { year: y, months: months.map((m) => ({ tmax: m.days ? Math.round(m.tmax / m.days) : null, tmin: m.days ? Math.round(m.tmin / m.days) : null, rain: m.days ? Math.round(m.rainDays / m.days * 100) : null })) };
}

}

async function rangeWeather(geo, from, to) {
  const key = geo.lat + ',' + geo.lng + '|' + from + '|' + to;
  if (mem.wx[key]) return mem.wx[key];
  const ahead = (parseIso(to) - parseIso(todayIso())) / DAY;
  let days = [];
  if (ahead <= 15 && (parseIso(from) - parseIso(todayIso())) / DAY >= 0) {
    const j = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + geo.lat + '&longitude=' + geo.lng + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=' + from + '&end_date=' + to);

      const a = acc[s.slice(5)];
      days.push(a && a.n ? { date: s, tmax: Math.round(a.tx / a.n), tmin: Math.round(a.tn / a.n), rain: Math.round(a.wet / a.n * 100), kind: 'Typical for this date (last ' + a.n + ' years)' } : { date: s, tmax: null, tmin: null, rain: null, kind: 'No data' });

function weightOf(s) { const x = suggestNights(s); return clamp(x ? x.n : 2, 2, 3); }

  while (used < target) { let bi = 0; ideal.forEach((x, i) => { if (x - alloc[i] > ideal[bi] - alloc[bi]) bi = i; }); alloc[bi]++; used++; }

      else { me.nights++; s.trip.target++; s.banner = 'Every other place already has 1 night, so the trip is now ' + (s.trip.target + 1) + ' days.'; }
    } else {

      else { const r = others.slice().sort((a, b) => (a.nights / weightOf(a)) - (b.nights / weightOf(b)))[0]; me.nights--; r.nights++; s.banner = 'One less night in ' + shortName(me) + ', one more in ' + shortName(r) + '. Still ' + (s.trip.target + 1) + ' days.'; }

    onkeydown: (e) => { if (e.key === 'Enter' && e.target.value.trim()) { addStop(e.target.value); if (SUG.qadd) { SUG.qadd.q = ''; SUG.qadd.items = []; } render(); } } });

    h('div', { class: 'row between' }, h('h2', {}, 'Quick actions'), h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Close', onclick: closeSheet }, '×')),
    h('div', { class: 'mu sm' }, st.length ? routeNames(st) : 'No places yet.'),
    h('label', { for: 'qadd' }, 'Search and add a place'), qadd, suggestBox('qadd'),
    h('div', { class: 'grid2' },
      h('button', { type: 'button', class: 'btn', onclick: run(() => { set((s) => { s.tab = 'plan'; }); setTimeout(() => { const m = document.getElementById('main'); m.scrollTop = 0; const el = document.getElementById('wiz'); if (el) el.focus(); }, 120); }) }, '✨ Make my plan'),
      h('button', { type: 'button', class: 'btn2', onclick: run(() => planNow(false)) }, '🔎 Research my trip'),
      h('button', { type: 'button', class: 'btn2', disabled: st.length < 2 ? true : null, onclick: run(bestOrder) }, '🧭 Best order'),
      h('button', { type: 'button', class: 'btn2', disabled: st.length ? null : true, onclick: run(differentPlan) }, '🔀 Different plan'),
      h('button', { type: 'button', class: 'btn2', disabled: st.length ? null : true, onclick: run(() => set((s) => { if (s.tab !== 'compare') s.back = s.tab; s.tab = 'compare'; })) }, '⚖️ Compare plans'),
      h('button', { type: 'button', class: 'btn2', onclick: run(() => { set((s) => { s.tab = 'plan'; }); setTimeout(() => { const m = document.getElementById('main'); m.scrollTop = 0; const el = document.getElementById('explore'); if (el) el.focus(); }, 120); }) }, '🗺️ Explore a place'),
      h('button', { type: 'button', class: 'btn2', disabled: st.length ? null : true, onclick: run(() => set((s) => { s.tab = 'days'; s.dsub = 'plan'; })) }, '📅 Day plan'),
      h('button', { type: 'button', class: 'btn2', disabled: st.length ? null : true, onclick: run(() => savePlan(false)) }, '💾 Save'),
      h('button', { type: 'button', class: 'btn2', onclick: run(newTrip) }, '🆕 New trip')),
    h('h3', {}, 'Ready-made plans'),
    h('div', { class: 'row wrap', style: 'gap:6px' }, PRESETS.map((p) => h('button', { type: 'button', class: 'pill', onclick: run(() => loadPreset(p)) }, p.name))),
    st.length ? h('details', {}, h('summary', {}, 'Your places (' + st.length + ')'), st.map((s, i) => h('div', { class: 'row line' }, h('span', { class: 'num' }, i + 1), h('div', { class: 'grow b' }, shortName(s)),
      h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Move earlier', disabled: i === 0, onclick: () => set((x) => { const a = x.trip.stops; [a[i - 1], a[i]] = [a[i], a[i - 1]]; x.trip.swaps = {}; x.banner = 'Moved ' + shortName(s) + '.'; }) }, '↑'),
      h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Move later', disabled: i === st.length - 1, onclick: () => set((x) => { const a = x.trip.stops; [a[i + 1], a[i]] = [a[i], a[i + 1]]; x.trip.swaps = {}; x.banner = 'Moved ' + shortName(s) + '.'; }) }, '↓'),
      h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Remove ' + shortName(s), onclick: () => removeStopAt(i) }, '×')))) : null);
  host.replaceChildren(h('div', { class: 'sheet-bg', onclick: closeSheet }, sheet));
}
document.getElementById('fab').addEventListener('click', openSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && mem.sheet) closeSheet(); });

/* ---------- install ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false; render(); });
window.addEventListener('appinstalled', () => { installEvt = null; document.getElementById('install').hidden = true; set((s) => { s.banner = 'Trip Desk is installed. Open it from your home screen.'; }); });
async function installApp() {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; document.getElementById('install').hidden = true; return; }
  set((s) => { s.tab = 'settings'; });
}
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
document.getElementById('install').addEventListener('click', installApp);

/* ---------- start ---------- */
document.getElementById('gear').addEventListener('click', () => set((s) => { if (s.tab !== 'settings') s.back = s.tab; s.tab = 'settings'; }));
render();
ensureRates().then(render).catch(() => {});
if (S.trip.stops.some((s) => !s.geo || !(R[s.key] && R[s.key].voyage && R[s.key].voyage.v === 3))) researchAll(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
