<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Desk</title>
<meta name="description" content="Plan a trip in a minute: route, day-by-day plan, weather and costs from free travel guides.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Style B: photo-first magazine. Dark background, big photos, serif titles, white primary buttons. */
:root{--bg:#111111;--sf:#1C1C1E;--sf2:#26262A;--ln:#323238;--ink:#F5F5F4;--mu:#A3A3AA;--ac:#F2C46D;--onac:#111111;--so:rgba(255,255,255,.10);--si:#FFFFFF;--sand:#F2C46D;--wb:#3A2F17;--wi:#F7D58C;--bd:#3F1D22;--bi:#FFB4BE;--good:#9FE3B4;
  --hi:#FFFFFF;--onhi:#111111;--nav:#000000;--navln:#1F1F22;--navmu:#7A7A80;--dash:#3A3A40;--optsel:#2F2F35;--btn2ln:#3D3D44;--focus:#8A8A92;--hlln:#5A5A62;--sh:none;color-scheme:dark}
/* Day theme: same layout and photos, light paper background */
:root[data-theme="light"]{--bg:#F4F1EA;--sf:#FFFFFF;--sf2:#F1EDE4;--ln:#E2DCCF;--ink:#17161A;--mu:#615E66;--ac:#9A5B00;--onac:#FFFFFF;--so:rgba(0,0,0,.06);--si:#17161A;--sand:#9A5B00;--wb:#FBEFD5;--wi:#6F4A00;--bd:#FBE3E3;--bi:#8A1C1C;--good:#1E6B3A;
  --hi:#17161A;--onhi:#FFFFFF;--nav:#FFFFFF;--navln:#E2DCCF;--navmu:#8A8690;--dash:#D3CCBD;--optsel:#ECE6DA;--btn2ln:#D8D1C3;--focus:#615E66;--hlln:#B8B0A0;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#F4F1EA;--sf:#FFFFFF;--sf2:#F1EDE4;--ln:#E2DCCF;--ink:#17161A;--mu:#615E66;--ac:#9A5B00;--onac:#FFFFFF;--so:rgba(0,0,0,.06);--si:#17161A;--sand:#9A5B00;--wb:#FBEFD5;--wi:#6F4A00;--bd:#FBE3E3;--bi:#8A1C1C;--good:#1E6B3A;
  --hi:#17161A;--onhi:#FFFFFF;--nav:#FFFFFF;--navln:#E2DCCF;--navmu:#8A8690;--dash:#D3CCBD;--optsel:#ECE6DA;--btn2ln:#D8D1C3;--focus:#615E66;--hlln:#B8B0A0;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Arial,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--ac)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px;background:var(--bg)}
.brand{font:700 13px Inter,Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:0;text-transform:none;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;margin-top:2px}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 32px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
nav{flex:none;display:flex;gap:2px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--navln)}
nav button{flex:1;min-width:0;min-height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--navmu);cursor:pointer;padding:0 2px}
nav button[aria-current="page"]{color:var(--hi)}
nav button[aria-current="page"] .ico{filter:none;opacity:1}
nav .ico{display:flex;font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
h1{margin:6px 0 0;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
h2{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:21px;font-weight:700;letter-spacing:0}
h2.title{font-size:30px;font-style:italic}
h3{margin:0;font:700 11.5px Inter,Arial,sans-serif;color:var(--mu);text-transform:uppercase;letter-spacing:.18em}
p{margin:0}
.kicker{font:700 11.5px Inter,Arial,sans-serif;color:var(--mu);text-transform:uppercase;letter-spacing:.2em;margin-top:6px}
.intro{display:flex;flex-direction:column;gap:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.card .card{border:0;padding:0;background:transparent}
.card.center{align-items:center;text-align:center}
.card.hl{border-color:var(--hlln)}
.card.focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(242,196,109,.35)}
.emoji{font-size:40px}
.mu{color:var(--mu)}.sm{font-size:13.5px}.xs{font-size:12px}.b{font-weight:700}.nowrap{white-space:nowrap}.accent{color:var(--ac)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.line{border-top:1px solid var(--ln);padding-top:12px}
.sub{padding:8px 0;border-top:1px dashed var(--ln)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
label{font-size:12px;font-weight:600;color:var(--mu)}
.curpick{height:40px;border:1px solid var(--ln);border-radius:12px;background:var(--sf2);color:var(--ink);padding:0 4px 0 8px;font-size:14px;font-weight:600;width:auto;max-width:84px;min-width:0;flex:none}
header .brand{min-width:0;flex:1 1 auto;overflow:hidden}
header .row{flex:none;min-width:0}
.inp{height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;background:var(--sf2);width:100%;min-width:0;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--focus)}
.inp.num{width:120px;flex:none;text-align:right}

.btn{min-height:50px;border:0;border-radius:12px;background:var(--hi);color:var(--onhi);font-weight:800;letter-spacing:.06em;cursor:pointer;padding:0 18px;white-space:nowrap;text-transform:uppercase;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.btn.big{width:100%;min-height:54px;font-size:15px;letter-spacing:.12em}
.btn2{min-height:42px;border-radius:12px;border:1px solid var(--btn2ln);background:var(--sf2);color:var(--ink);font-weight:600;cursor:pointer;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn2.sm{min-height:36px;font-size:13px;padding:0 12px}
.btn2.gold{border-color:var(--ac);color:var(--ac)}
.btn2:disabled{opacity:.4;cursor:default}
.btn2[aria-pressed="true"]{background:var(--hi);color:var(--onhi);border-color:var(--hi)}
.link{border:0;background:transparent;color:var(--ac);font-weight:600;cursor:pointer;padding:6px 0;min-height:32px;font-size:13.5px;text-decoration:none;text-align:left}
.acts{display:flex;flex-wrap:wrap;gap:2px 16px}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:default}
.stv{min-width:88px;text-align:center;font-weight:700}
.tl .ibtn{width:34px;height:34px;border-radius:10px}
.tl .stv{min-width:64px;font-size:14px}
.tl .stp{gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--so);color:var(--si);white-space:nowrap}
.chip.warn{background:var(--wb);color:var(--wi)}.chip.bad{background:var(--bd);color:var(--bi)}.chip.plain{background:var(--sf2);color:var(--mu)}
.chip.good{background:rgba(159,227,180,.14);color:var(--good)}
.segs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px}
.segs button{flex:1;min-height:40px;border-radius:9px;border:0;background:transparent;color:var(--mu);font-weight:600;cursor:pointer;padding:0 4px;font-size:13.5px}
.segs button[aria-pressed="true"]{background:var(--hi);color:var(--onhi)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--hi);background:var(--hi);color:var(--onhi)}
.pill:disabled{opacity:.5}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf2);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--hi);background:var(--optsel)}
.opt.v{flex-direction:column;align-items:flex-start;gap:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.num{width:28px;height:28px;border-radius:14px;background:var(--hi);color:var(--onhi);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
/* photo hero: full-bleed picture with the title over it */
.cover{margin:0 -16px;min-height:300px;padding:18px 18px 22px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background-color:#1d3b33;background-size:cover;background-position:center;position:relative}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.88))}
.cover>*{position:relative}
.cover{color:#fff}.cover .btn{background:#fff;color:#111}.cover .btn2{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.35);color:#fff}
.cover .big{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:46px;line-height:1}
.cover .lead{font-size:14px;opacity:.9;max-width:34em}
.cover.short{min-height:220px}
.g0{background-image:linear-gradient(135deg,#1B5E20,#00897B 55%,#FFB74D)}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(0,0,0,.35);border-radius:14px;padding:10px 8px;backdrop-filter:blur(4px)}
.hstats>div{text-align:center;min-width:0}
.hv{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hl{font-size:11px;opacity:.8}
.boxes{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:6px}
.boxes>div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.boxes small{font-size:11px;color:var(--mu)}
.boxes input{border:0;background:transparent;font-weight:700;font-size:14px;padding:0;width:100%;min-width:0;outline:none;color:var(--ink)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mini button{width:28px;height:28px;border-radius:8px;border:1px solid var(--ln);background:var(--sf2);cursor:pointer;flex:none;font-weight:700}
.mini b{font-size:16px}
/* place tiles with a tick */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:128px;border-radius:14px;position:relative;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;border:0;text-align:left;cursor:pointer;color:#fff;background-color:#24413a;background-size:cover;background-position:center;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0) 65%)}
.tile>*{position:relative}
.tile b{font-family:"Playfair Display",Georgia,serif;font-size:19px;line-height:1.1}
.tile small{font-size:11px;opacity:.85;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tile .ck{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:rgba(0,0,0,.25)}
.tile[aria-pressed="true"] .ck{background:#fff;color:#111}
.tile[aria-pressed="true"]{outline:2px solid #fff;outline-offset:-2px}
.t1{background-image:linear-gradient(135deg,#2E7D32,#81C784)}.t2{background-image:linear-gradient(135deg,#00695C,#4DB6AC)}.t3{background-image:linear-gradient(135deg,#E65100,#FFB74D)}.t4{background-image:linear-gradient(135deg,#283593,#7986CB)}.t5{background-image:linear-gradient(135deg,#6A1B9A,#BA68C8)}.t6{background-image:linear-gradient(135deg,#37474F,#90A4AE)}
.pkg{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--ln);padding-top:12px}
.pkg .ph{flex:none;width:76px;height:76px;border-radius:12px;background-size:cover;background-position:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--hi);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.spin.light{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
/* route timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl>li{position:relative;padding-left:40px}
.tl>li::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:2px dashed var(--dash)}
.tl>li:first-child::before{top:14px}.tl>li:last-child::before{bottom:auto;height:14px}
.tl-end{display:flex;align-items:center;gap:10px;padding:6px 0}
.tl-end .dot{position:absolute;left:7px;top:12px;width:14px;height:14px;border-radius:7px;background:var(--bg);border:3px solid var(--ac)}
.tl-stop{padding:10px 0;display:flex;gap:10px}
.tl-stop .num{position:absolute;left:0;top:10px}
.stopname{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--ink);font-size:16px}
.tl-leg{padding:2px 0}
.legbtn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--sf2);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left}
.lm{font-size:20px;flex:none}
.chev{display:inline-flex;color:var(--mu);flex:none;transition:transform .15s}
.insbox{background:var(--sf2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin:6px 0}
details.fold{gap:0}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:28px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{font-size:18px}
details.fold[open]>summary .chev{transform:rotate(180deg)}
.foldbody{display:flex;flex-direction:column;gap:10px;margin-top:12px}
details summary{cursor:pointer;font-weight:600}
.glance{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--ln);padding-top:8px}
.gd{flex:none;width:72px;display:flex;flex-direction:column}
/* days */
.day{gap:6px}
.dayhead{display:flex;align-items:center;gap:12px;padding-bottom:6px}
.dnum{flex:none;width:50px;height:54px;border-radius:12px;background:var(--hi);color:var(--onhi);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dnum span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}.dnum b{font-size:24px;font-family:"Playfair Display",Georgia,serif}
.day.final .dnum{background:var(--ac);color:var(--onac)}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.itime{flex:none;width:72px;font-size:11px;font-weight:700;color:var(--mu);padding-top:3px;text-transform:uppercase;letter-spacing:.06em}
.item.travel .itime{font-size:20px;padding-top:0}
.item.eat .itime{color:var(--ac)}
.item.see .itime{color:var(--ink)}
.item.free{opacity:.75}
.note{background:var(--sf2);border-radius:12px;padding:10px 14px;font-size:13.5px}
.warnbox{background:var(--wb);color:var(--wi);border-radius:12px;padding:10px 12px}
.photo{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:var(--sf2)}
.thumb{flex:none;width:88px;height:68px;border-radius:12px;object-fit:cover;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:30px}
.stat{background:var(--sf2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .b{font-size:15px}
.total{font-family:"Playfair Display",Georgia,serif;font-size:38px;font-weight:700;font-style:italic}
.total.sm2{font-size:24px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:10px;border-radius:5px;background:var(--sf2);overflow:hidden}.bar>div{height:100%;background:var(--hi)}.bar>div.over{background:#F59E0B}
.months{display:flex;align-items:flex-end;gap:4px;height:74px}
.months>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:74px;font-size:11px;color:var(--mu)}
.months span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--dash)}
.months span.best{background:var(--ac)}.months span.on{background:var(--hi)}
.switch{flex:none;position:relative;width:52px;height:32px;border-radius:16px;border:0;cursor:pointer;background:var(--dash)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]{background:var(--ac)}.switch[aria-pressed="true"]::after{left:23px;background:var(--onac)}
.check{min-height:46px;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;width:100%}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;color:var(--onhi);font-size:13px;font-weight:900}
.check[aria-pressed="true"] .box{background:var(--hi);border-color:var(--hi)}
.check[aria-pressed="true"]>span:last-child{color:var(--mu);text-decoration:line-through}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--ln);padding-top:8px}
.kv>:last-child{font-weight:700;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map{height:240px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:var(--sf2);z-index:0}
.map.small{height:180px}
.leaflet-container{background:var(--sf2)}
.vlog{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:8px 0;border-top:1px solid var(--ln)}
.vlog img{flex:none;width:112px;height:63px;object-fit:cover;border-radius:8px;background:var(--sf2)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(84px + env(safe-area-inset-bottom));width:min(600px,calc(100% - 32px));background:var(--hi);color:var(--onhi);border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.hstats{grid-template-columns:repeat(2,1fr)}.itime{width:60px}.cover .big{font-size:38px}.tile{height:116px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Trip Desk<small id="sub"></small></div>
    <div class="row" style="gap:8px">
      <button class="btn" id="install" type="button" hidden style="min-height:40px;padding:0 12px;font-size:14px">Install</button>
      <select id="curpick" class="curpick" aria-label="Show money in" title="Show money in"></select>

<script>
'use strict';
/* ============================================================
   Trip Desk: free-first trip planner.
   Live data with no API key: Open-Meteo, Wikivoyage, Wikipedia,
   Wikimedia Commons, REST Countries, open.er-api.com, Bing News (via your proxy).
   Claude is used only by the "Check my plan" button, through your Apps Script backend.
   ============================================================ */

const LS = 'tripdesk.v1', LSR = 'tripdesk.research.v1', LSV = 'tripdesk.visa.v1';
const enc = encodeURIComponent;
const DAY = 86400000;
const VV = 5;                       // guide cache version: bump to re-read every place

function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return isoOf(d); }
function todayIso() { return isoOf(new Date()); }
function nice(s, opt) { return parseIso(s).toLocaleDateString('en-GB', opt || { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-IN'); }
/* money: every amount is worked out in rupees, then shown in the currency chosen in Settings */
const MONEY_OPTS = [['INR', '₹ Indian rupee'], ['LOCAL', 'Local: each place\'s own money'], ['USD', '$ US dollar'], ['GBP', '£ British pound'], ['EUR', '€ Euro'], ['THB', '฿ Thai baht'], ['AED', 'AED UAE dirham'], ['SGD', 'S$ Singapore dollar'], ['AUD', 'A$ Australian dollar'], ['LKR', 'LKR Sri Lankan rupee'], ['NPR', 'NPR Nepali rupee'], ['IDR', 'Rp Indonesian rupiah'], ['MYR', 'RM Malaysian ringgit'], ['JPY', '¥ Japanese yen'], ['VND', '₫ Vietnamese dong']];
function localCodeFor(cc) {
  if (!cc) return null;
  if (cc === 'IN') return 'INR';
  for (const k of Object.keys(R || {})) { const r = R[k]; if (r && r.geo && r.geo.cc === cc && r.cur && r.cur.code) return r.cur.code; }
  return null;
}
/* the country and money of one stop, for showing its prices */
function stopCur(key) {
  const s = S.trip.stops.find((x) => x.key === key), r = (R && R[key]) || {};
  return { cc: s && s.geo ? s.geo.cc : null, code: r.cur && r.cur.code ? r.cur.code : null };
}
function moneyTarget(cc, localCode) {
  const c = (S.settings && S.settings.cur) || 'INR';
  if (c !== 'LOCAL') return c;
  return localCode || localCodeFor(cc) || 'INR';
}
function fmtMoney(code, value) {
  if (code === 'INR') return '₹' + fmt(value);
  try { return new Intl.NumberFormat('en-IN', { style: 'currency', currency: code, maximumFractionDigits: Math.abs(value) >= 100 ? 0 : 2 }).format(value); }
  catch (e) { return code + ' ' + fmt(value); }
}
/* an amount worked out in rupees, shown in the chosen currency */
function showInr(inr, cc, localCode) {
  if (inr == null || !isFinite(inr)) return '—';
  const code = moneyTarget(cc, localCode);
  const r = RATES && RATES.rates && RATES.rates[code];
  if (code === 'INR' || !r) return fmtMoney('INR', inr);
  return fmtMoney(code, inr * r);
}
/* a price written in a guide, e.g. "€30" or "฿1,500": shown as written, plus the chosen currency when it differs */
function showPrice(raw, cc, localCode) {
  const text = String(raw || '').trim();
  if (!text) return '';
  const f = faresIn(text, localCode || localCodeFor(cc))[0];
  if (!f || !f.code) return text;
  if (f.code === moneyTarget(cc, localCode)) return text;
  const lo = toInr(f.code, f.a);

}
function fmtH(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- state ---------- */
const DEFAULTS = {
  tab: 'plan', back: 'plan', dsub: 'plan', csub: 'sum', pstop: 0, banner: '',
  settings: {

    food: 'both', budget: 'comfort', cap: 200000, wtemp: 'warm', wrain: 'mid', cur: 'INR', conv: { a: '1000', from: 'INR', to: 'USD' },
    proxy: 'https://youtubenews.banerjee-tara.workers.dev/?url=', backend: '', passcode: ''
  },
  trip: { name: '', stops: [], start: addDays(todayIso(), 45), travellers: 2, free: false, legModes: {}, swaps: {}, over: {}, seed: 1, extra: {}, skip: {}, must: {}, startAt: null, endMode: 'home', endAt: null, target: null, lock: false },
  wdate: '', people: ['You', 'Partner'], payer: 0, expenses: [], docs: {}, plans: [],
  check: null, meterLog: []

let S = load(LS, DEFAULTS);
let R = load(LSR, {});              // research per place key
let V = load(LSV, null);            // visa table cache
let RATES = null;                   // {at, rates} per INR
const busy = {};                    // key -> {source: true}
const mem = { wx: {}, photos: {}, news: {} };

function load(k, def) {
  try {
    const raw = localStorage.getItem(k);
    if (!raw) return structuredClone(def);
    const v = JSON.parse(raw);
    if (def && typeof def === 'object' && !Array.isArray(def)) return deepMerge(structuredClone(def), v);
    return v;
  } catch (e) { return def === null ? null : structuredClone(def); }
}
function deepMerge(a, b) {
  Object.keys(b || {}).forEach((k) => {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]);
    else a[k] = b[k];

}

  try { localStorage.setItem(LSR, JSON.stringify(R)); } catch (e) { pruneResearch(); }
}

/* ---------- DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;

  kids.flat(Infinity).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    el.append(c.nodeType ? c : String(c));
  });

}

/* ---------- network ---------- */
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}
async function getText(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out' : (e.message || 'Network error'));
  } finally { clearTimeout(t); }
}

/* ---------- places: geocoding ---------- */
async function geocode(input) {
  const parts = String(input).split(',').map((s) => s.trim()).filter(Boolean);
  const name = parts[0], hint = norm(parts.slice(1).join(' '));
  const home = S.settings.home && S.settings.home.cc;
  // 1) Wikipedia knows common spellings, states and regions (Kanyakumari, Kerala, Munnar…)
  let failed = 0;
  const wikiP = wikiPlace(input).catch(() => { failed++; return null; });
  // 2) Open-Meteo geocoding gives exact towns with country codes
  const omP = getJSON('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name=' + enc(name))
    .then((j) => (j.results || []).map((r) => ({ name: r.name, lat: r.latitude, lng: r.longitude, cc: (r.country_code || '').toUpperCase(), country: r.country || '', admin1: r.admin1 || '', pop: r.population || 0 })))
    .catch(() => { failed++; return []; });
  const [wiki, om0] = await Promise.all([wikiP, omP]);
  if (failed === 2) throw new Error('Could not reach the map services. Check your connection and try again.');
  let om = om0;
  if (hint) { const f = om.filter((r) => norm(r.country + ' ' + r.admin1).includes(hint)); if (f.length) om = f; }
  om.sort((a, b) => (b.cc === home) - (a.cc === home) || b.pop - a.pop);
  const res = [];
  if (wiki) res.push(wiki);
  om.forEach((r) => { if (!res.some((x) => hav(x, r) < 25)) res.push(r); });
  // If Wikipedia found it, keep Open-Meteo matches only when they are in the same country (avoids "Kerälä, Finland" for Kerala)
  if (wiki && wiki.cc) return res.filter((r, i) => i === 0 || r.cc === wiki.cc);
  return res;
}
async function wikiPlace(input) {
  const W = 'https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1&prop=coordinates|pageprops&ppprop=wikibase_item|disambiguation';
  let j = await getJSON(W + '&action=query&titles=' + enc(input.trim().replace(/^\w/, (c) => c.toUpperCase())), 12000);
  let pg = j.query && j.query.pages && j.query.pages[0];
  if (!pg || pg.missing || !pg.coordinates || (pg.pageprops && 'disambiguation' in pg.pageprops)) {
    j = await getJSON(W + '&action=query&generator=search&gsrlimit=1&gsrsearch=' + enc(input), 12000);
    pg = j.query && j.query.pages && j.query.pages[0];
  }
  if (!pg || !pg.coordinates || !pg.coordinates[0]) return null;
  const out = { name: pg.title.replace(/\s*\(.*\)$/, '').split(',')[0], lat: pg.coordinates[0].lat, lng: pg.coordinates[0].lon, cc: '', country: '', admin1: '', wiki: pg.title };
  const qid = pg.pageprops && pg.pageprops.wikibase_item;
  try {
    if (!qid) throw new Error('no item');
    const sparql = 'SELECT ?iso ?cl ?al WHERE { wd:' + qid + ' wdt:P17 ?c . ?c wdt:P297 ?iso . OPTIONAL { wd:' + qid + ' wdt:P131 ?a . ?a rdfs:label ?al . FILTER(LANG(?al)="en") } ?c rdfs:label ?cl . FILTER(LANG(?cl)="en") } LIMIT 1';
    const q = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + enc(sparql), 12000);
    const b = q.results && q.results.bindings && q.results.bindings[0];
    if (!b) throw new Error('no country');
    out.cc = b.iso.value.toUpperCase(); out.country = b.cl.value; out.admin1 = b.al ? b.al.value : '';
  } catch (e) {
    try {
      const r = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude=' + out.lat + '&longitude=' + out.lng, 10000);
      out.cc = (r.countryCode || '').toUpperCase(); out.country = r.countryName || ''; out.admin1 = r.principalSubdivision || '';
    } catch (e2) {}
  }
  return out;
}
function hav(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(x));
}

/* ---------- Wikivoyage ---------- */
const WV = 'https://en.wikivoyage.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1';
const WANT = {
  understand: /^understand/i, getin: /^get in/i, getaround: /^get around/i, see: /^see\b/i, do: /^do\b/i,
  eat: /^eat\b/i, sleep: /^sleep\b/i, safe: /^stay (safe|healthy)/i, cities: /^cities\b/i, other: /^other destinations/i, gonext: /^go next/i, districts: /^districts/i
};
async function wvParseSections(title) {
  const j = await getJSON(WV + '&action=parse&prop=sections&page=' + enc(title));
  if (j.error || !j.parse) throw new Error((j.error && j.error.info) || 'missing');
  return j.parse;
}
async function wvFind(stop) {
  const tries = [stop.name, stop.geo && stop.geo.name].filter(Boolean);
  for (const t of tries) { try { return await wvParseSections(t); } catch (e) {} }
  const s = await getJSON(WV + '&action=opensearch&limit=3&search=' + enc(stop.geo ? stop.geo.name : stop.name));
  const t = s && s[1] && s[1][0];
  if (!t) throw new Error('No Wikivoyage page for this place');
  return wvParseSections(t);
}
function cleanDoc(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  // keep each listing's map position before the markup is stripped
  d.querySelectorAll('li').forEach((li) => {
    const m = li.querySelector('[data-lat][data-lon]');
    if (m) { li.setAttribute('data-plat', m.getAttribute('data-lat')); li.setAttribute('data-plon', m.getAttribute('data-lon')); return; }
    const la = li.querySelector('.latitude'), lo = li.querySelector('.longitude');
    if (la && lo) { li.setAttribute('data-plat', txt(la)); li.setAttribute('data-plon', txt(lo)); }
  });
  d.querySelectorAll('style,script,sup,.mw-editsection,.noprint,.listing-metadata,.listing-coordinates,.geo,.mw-references-wrap,.reference,.navbox,.thumb,figure,.mw-kartographer-maplink,.listing-sister-icons,.pagebanner,.mw-empty-elt').forEach((n) => n.remove());
  return d;
}
function txt(n) { return (n && n.textContent || '').replace(/\s+/g, ' ').replace(/\s([,.;:])/g, '$1').trim(); }
function listItems(d, max) {
  const out = [], seen = new Set();
  d.querySelectorAll('li').forEach((li) => {
    if (li.closest('.toc')) return;
    const t = txt(li);
    if (t.length < 12) return;
    const nEl = li.querySelector('.listing-name, .fn, b');
    const first = li.firstElementChild;
    let name = nEl ? txt(nEl) : (first && /^(A|STRONG|SPAN)$/.test(first.tagName) && t.startsWith(txt(first)) ? txt(first) : '');
    if (!name || name.length > 80) name = t.split(/[.:—–(]/)[0].slice(0, 70).trim();
    // a fare at the start ("€30 for the Acropolis") is the price, not part of the name
    const lead = name.match(/^((?:US\$|S\$|Rs\.?\s?|INR\s?|THB\s?|USD\s?|EUR\s?|GBP\s?|[€£$¥฿₹])\s?\d[\d,.]*(?:\s?(?:-|–|to)\s?\d[\d,.]*)?)\s*(?:for|at|per|—|–|-|:)?\s*/i);
    let leadFare = '';
    if (lead) { leadFare = lead[1]; name = name.slice(lead[0].length).trim().replace(/^the\s+/i, '') || name; }
    const k = norm(name);
    if (!k || seen.has(k)) return;
    seen.add(k);
    const pEl = li.querySelector('.listing-price');
    const priceText = pEl ? txt(pEl) : leadFare;
    let body = t.startsWith(name) ? t.slice(name.length).replace(/^[\s,.:;—–-]+/, '') : t;
    if (!body) body = t;
    const lat = parseFloat(li.getAttribute('data-plat')), lon = parseFloat(li.getAttribute('data-plon'));
    out.push(Object.assign({ name, text: body.slice(0, 900), price: priceText }, isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 ? { lat, lon } : {}));
  });
  return out.slice(0, max || 14);
}
function catListings(d) {
  const out = { budget: [], mid: [], splurge: [], other: [] };
  const catOf = (tt) => /budget|cheap|hostel/i.test(tt) ? 'budget' : /mid/i.test(tt) ? 'mid' : /splurge|luxury|upscale|expensive|high[\s-]?end|top end/i.test(tt) ? 'splurge' : null;
  const hs = [...d.body.querySelectorAll('h3,h4')];
  const firstBox = hs.length ? (hs[0].closest('.mw-heading') || hs[0]) : null;
  const take = (cat, from) => {
    const box = d.createElement('div');
    let n = from;
    while (n && !(n.matches && n.matches('.mw-heading,h2,h3,h4'))) { box.appendChild(n.cloneNode(true)); n = n.nextElementSibling; }
    out[cat] = out[cat].concat(listItems(box, 8));
  };
  if (!hs.length) { out.other = listItems(d, 14); return out; }
  // listings before the first sub-heading
  const root = firstBox.parentElement; const pre = d.createElement('div');
  for (const c of [...root.children]) { if (c === firstBox) break; pre.appendChild(c.cloneNode(true)); }
  out.other = listItems(pre, 8);
  hs.forEach((hd) => { const box = hd.closest('.mw-heading') || hd; take(catOf(txt(hd)) || 'other', box.nextElementSibling); });
  return out;
}
function paragraphs(d, max) { return [...d.querySelectorAll('p')].map(txt).filter((t) => t.length > 40).slice(0, max || 4); }

const MODES = [
  ['Tuk-tuk', /tuk[\s-]?tuks?/i, '🛺'], ['Auto-rickshaw', /auto[\s-]?rickshaws?|\bautos\b/i, '🛺'], ['Cycle rickshaw', /cycle[\s-]?rickshaws?|pedicabs?|becaks?/i, '🚲'],
  ['Motorbike taxi', /motorbike taxis?|motorcycle taxis?|bike taxis?|ojek/i, '🏍️'], ['Ride-hailing apps', /\b(grab|gojek|uber|ola cabs|\bola\b|bolt|rapido|careem|lyft)\b/i, '📱'],
  ['Taxi', /\btaxis?\b|\bcabs?\b/i, '🚕'], ['Metro and skytrain', /\b(metro|mrt|bts|subway|skytrain|underground|lrt)\b/i, '🚇'], ['Songthaew', /songthaews?/i, '🛻'],
  ['Bus', /\bbus(es)?\b/i, '🚌'], ['Ferry and boat', /\b(ferr(y|ies)|boats?|water ?bus(es)?|houseboats?|longtails?)\b/i, '⛴️'],
  ['Scooter and motorbike', /\b(scooters?|motorbikes?|motorcycles?|mopeds?|two[\s-]?wheelers?)\b/i, '🛵'], ['Tram', /\btrams?\b/i, '🚋'],
  ['Train', /\b(trains?|railway|rail)\b/i, '🚆'], ['Bicycle', /\b(bicycles?|cycling)\b/i, '🚲'], ['Jeep', /\bjeeps?\b/i, '🚙'],
  ['Car with driver', /car with (a )?driver|hire a car|car rental|rent a car|self[\s-]?drive/i, '🚗'], ['On foot', /\bon foot\b|\bwalking\b/i, '🚶']
];
function modeIcon(name) { const m = MODES.find((x) => x[1].test(name)); return m ? m[2] : '🧭'; }
function headingBlocks(d) {
  const hs = [...d.body.querySelectorAll('h2,h3,h4,h5')];
  return hs.map((hd) => {
    const box = hd.closest('.mw-heading') || hd;
    let n = box.nextElementSibling; const parts = [];
    while (n && !(n.matches('.mw-heading,h2,h3,h4,h5'))) { parts.push(txt(n)); n = n.nextElementSibling; }
    return { title: txt(hd), text: parts.join(' ').replace(/\s+/g, ' ').trim() };
  });
}
function extractModes(d) {
  const blocks = headingBlocks(d).filter((b) => /^by\s/i.test(b.title) && b.text.length > 20);
  let modes = blocks.map((b) => ({ name: b.title.replace(/^by\s+/i, '').replace(/^\w/, (c) => c.toUpperCase()), text: b.text.slice(0, 900) }));
  if (modes.length < 2) {
    const all = txt(d.body);
    const sentences = all.split(/(?<=[.!?])\s+/);
    const found = [];
    MODES.forEach(([name, re]) => {
      if (modes.some((m) => re.test(m.name))) return;
      const ss = sentences.filter((s) => re.test(s)).slice(0, 3);
      if (ss.length) found.push({ name, text: ss.join(' ').slice(0, 900), pos: all.search(re) });
    });
    found.sort((a, b) => a.pos - b.pos);
    modes = modes.concat(found.map(({ name, text }) => ({ name, text })));
  }
  return modes.slice(0, 9);

/* fares mentioned in text, converted to rupees when the currency is known */
const CUR = { '฿': 'THB', '₹': 'INR', 'rs': 'INR', 'rs.': 'INR', 'inr': 'INR', 'thb': 'THB', 'baht': 'THB', 'rupee': 'INR', 'rupees': 'INR', 'us$': 'USD', 'usd': 'USD', 'dollar': 'USD', 'dollars': 'USD', '€': 'EUR', 'eur': 'EUR', 'euro': 'EUR', 'euros': 'EUR', '£': 'GBP', 'gbp': 'GBP', '¥': 'JPY', 'yen': 'JPY', 'rp': 'IDR', 'idr': 'IDR', 'rupiah': 'IDR', 'rm': 'MYR', 'myr': 'MYR', 'ringgit': 'MYR', 's$': 'SGD', 'sgd': 'SGD', 'aed': 'AED', 'dirham': 'AED', 'dirhams': 'AED', 'lkr': 'LKR', 'npr': 'NPR', 'vnd': 'VND', '₫': 'VND', 'dong': 'VND', '₩': 'KRW', 'krw': 'KRW', 'won': 'KRW', '₱': 'PHP', 'php': 'PHP', 'peso': 'PHP', 'pesos': 'PHP' };
const FARE_RE = /(฿|₹|US\$|S\$|\$|€|£|¥|₫|₩|₱|\b(?:Rs\.?|INR|THB|USD|EUR|GBP|IDR|Rp|RM|MYR|SGD|AED|LKR|NPR|VND|KRW|PHP)(?=\s?\d))\s?(\d(?:[\d,]*\d)?(?:\.\d+)?)(?:\s?(?:-|–|to)\s?(\d(?:[\d,]*\d)?(?:\.\d+)?))?|(\d(?:[\d,]*\d)?(?:\.\d+)?)(?:\s?(?:-|–|to)\s?(\d(?:[\d,]*\d)?(?:\.\d+)?))?\s?(baht|rupees?|rupiah|ringgit|dong|yen|euros?|dollars?|dirhams?|won|pesos?|THB|INR|USD|IDR|VND|MYR|LKR|NPR)\b/gi;
function faresIn(text, localCode) {
  const out = []; let m;
  FARE_RE.lastIndex = 0;
  while ((m = FARE_RE.exec(text)) && out.length < 3) {
    const sym = (m[1] || m[6] || '').toLowerCase().replace(/\s/g, '');
    let code = CUR[sym] || (sym.length === 3 ? sym.toUpperCase() : null);
    if (sym === '$' && localCode && localCode !== 'USD' && ['SGD', 'AUD', 'NZD', 'HKD', 'CAD', 'TWD'].includes(localCode)) code = localCode;
    const a = parseFloat((m[2] || m[4] || '0').replace(/,/g, ''));
    const bRaw = m[3] || m[5];
    const b = bRaw ? parseFloat(bRaw.replace(/,/g, '')) : null;
    if (a > 0) out.push({ raw: m[0].trim(), code, a, b });
  }
  return out;
}
/* a guide's text: fares in it are shown in the chosen currency, with the amount as written kept */
function convText(text, cc, localCode) {
  const str = String(text || '');
  if (!str || !RATES) return str;
  const target = moneyTarget(cc, localCode);
  return str.replace(FARE_RE, (whole) => {
    const f = faresIn(whole, localCode || localCodeFor(cc))[0];
    if (!f || !f.code || f.code === target) return whole;
    const lo = toInr(f.code, f.a);
    if (lo == null) return whole;
    return whole + ' (' + showInr(lo, cc, localCode) + ')';
  });
}
function toInr(code, amt) {
  if (!code || amt == null) return null;
  if (code === 'INR') return amt;
  const r = RATES && RATES.rates && RATES.rates[code];
  return r ? amt / r : null;
}
function fareLabel(f) {
  const lo = toInr(f.code, f.a);
  if (lo == null || f.code === moneyTarget(null)) return f.raw;
  return f.raw + ' ≈ ' + showInr(lo);
}

/* ---------- climate and weather (Open-Meteo) ---------- */
async function fetchClimate(geo) {
  const y = new Date().getFullYear() - 1;
  const j = await getJSON('https://archive-api.open-meteo.com/v1/archive?latitude=' + geo.lat + '&longitude=' + geo.lng + '&start_date=' + y + '-01-01&end_date=' + y + '-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto', 25000);
  const d = j.daily || {};
  const months = Array.from({ length: 12 }, () => ({ tmax: 0, tmin: 0, rainDays: 0, days: 0 }));
  (d.time || []).forEach((t, i) => {
    const m = months[+t.slice(5, 7) - 1];
    if (d.temperature_2m_max[i] == null) return;
    m.tmax += d.temperature_2m_max[i]; m.tmin += d.temperature_2m_min[i]; m.days++;
    if ((d.precipitation_sum[i] || 0) >= 1) m.rainDays++;
  });
  return { year: y, months: months.map((m) => ({ tmax: m.days ? Math.round(m.tmax / m.days) : null, tmin: m.days ? Math.round(m.tmin / m.days) : null, rain: m.days ? Math.round(m.rainDays / m.days * 100) : null })) };
}
function wxScore(tmax, rain) {
  const target = { cool: 21, warm: 27, hot: 32 }[S.settings.wtemp];
  const tol = { low: 25, mid: 45, high: 70 }[S.settings.wrain];
  if (tmax == null) return null;
  return clamp(Math.round(100 - Math.abs(tmax - target) * 7 - Math.max(0, rain - tol) * 1.1), 0, 100);
}
function verdict(score) { return score == null ? ['No data', 'plain'] : score >= 75 ? ['Great fit', ''] : score >= 50 ? ['Okay', 'warn'] : ['Poor fit', 'bad']; }
async function rangeWeather(geo, from, to) {
  const key = geo.lat + ',' + geo.lng + '|' + from + '|' + to;
  if (mem.wx[key]) return mem.wx[key];
  const ahead = (parseIso(to) - parseIso(todayIso())) / DAY;
  let days = [];
  if (ahead <= 15 && (parseIso(from) - parseIso(todayIso())) / DAY >= 0) {
    const j = await getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + geo.lat + '&longitude=' + geo.lng + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=' + from + '&end_date=' + to);
    const d = j.daily || {};
    days = (d.time || []).map((t, i) => ({ date: t, tmax: Math.round(d.temperature_2m_max[i]), tmin: Math.round(d.temperature_2m_min[i]), rain: d.precipitation_probability_max ? d.precipitation_probability_max[i] : null, kind: 'Forecast' }));
  } else {
    const yNow = new Date().getFullYear();
    const span = parseIso(to).getFullYear() - parseIso(from).getFullYear();
    const years = [1, 2, 3].map((k) => yNow - k - span);
    const shift = (s, y) => y + s.slice(4).replace('-02-29', '-02-28');
    const res = await Promise.allSettled(years.map((y) => getJSON('https://archive-api.open-meteo.com/v1/archive?latitude=' + geo.lat + '&longitude=' + geo.lng + '&start_date=' + shift(from, y) + '&end_date=' + shift(to, y + span) + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto', 20000)));
    const acc = {};
    res.forEach((r) => {
      if (r.status !== 'fulfilled') return;
      const d = r.value.daily || {};
      (d.time || []).forEach((t, i) => {
        const md = t.slice(5);
        const a = acc[md] || (acc[md] = { tx: 0, tn: 0, wet: 0, n: 0 });
        if (d.temperature_2m_max[i] == null) return;
        a.tx += d.temperature_2m_max[i]; a.tn += d.temperature_2m_min[i]; a.n++;
        if ((d.precipitation_sum[i] || 0) >= 1) a.wet++;
      });
    });
    for (let s = from; s <= to; s = addDays(s, 1)) {
      const a = acc[s.slice(5)];
      days.push(a && a.n ? { date: s, tmax: Math.round(a.tx / a.n), tmin: Math.round(a.tn / a.n), rain: Math.round(a.wet / a.n * 100), kind: 'Typical for this date (last ' + a.n + ' years)' } : { date: s, tmax: null, tmin: null, rain: null, kind: 'No data' });
    }
  }
  mem.wx[key] = days;
  return days;
}

/* ---------- vlogs: latest YouTube videos for a place, newest first (through your proxy) ---------- */
function ageHours(s) {
  const m = String(s || '').match(/(\d+)\s*(second|minute|hour|day|week|month|year)/i);
  if (!m) return 1e7;
  return +m[1] * { second: 1 / 3600, minute: 1 / 60, hour: 1, day: 24, week: 168, month: 720, year: 8760 }[m[2].toLowerCase()];
}
function findVideos(node, out) {
  if (!node || typeof node !== 'object' || out.length > 40) return;
  if (node.videoRenderer && node.videoRenderer.videoId) {
    const v = node.videoRenderer;
    const runs = (x) => x && (x.simpleText || (x.runs || []).map((r) => r.text).join('')) || '';
    out.push({ id: v.videoId, title: runs(v.title), channel: runs(v.ownerText || v.longBylineText), age: runs(v.publishedTimeText), length: runs(v.lengthText), views: runs(v.shortViewCountText) });
    return;
  }
  for (const k in node) findVideos(node[k], out);
}
async function fetchVlogs(place) {
  if (!S.settings.proxy) throw new Error('Add the proxy URL in Settings to load vlogs.');
  const q = place + ' travel vlog';
  const yt = 'https://www.youtube.com/results?search_query=' + enc(q) + '&sp=CAI%3D&hl=en&gl=IN';
  const html = await getText(S.settings.proxy + enc(yt), 20000);
  const m = html.match(/var ytInitialData\s*=\s*(\{[\s\S]*?\});\s*<\/script>/) || html.match(/ytInitialData"\]\s*=\s*(\{[\s\S]*?\});/);
  if (!m) throw new Error(/consent\.youtube|before you continue/i.test(html) ? 'YouTube asked for cookie consent through the proxy.' : 'YouTube did not return a video list.');
  const vids = []; findVideos(JSON.parse(m[1]), vids);
  const seen = new Set();
  // newest first; videos without an upload age (live, ads) go last, ties keep YouTube's order
  return vids.filter((v) => !seen.has(v.id) && seen.add(v.id)).map((v, i) => Object.assign(v, { i, h: ageHours(v.age) })).sort((a, b) => a.h - b.h || a.i - b.i).slice(0, 12);
}

function rs(key) { return R[key] || (R[key] = { err: {}, at: {} }); }

}
function openPlan(p) {
  set((s) => { storeCurrent(s); clearDesk(s); s.trip = Object.assign(freshTrip(), structuredClone(p.trip)); s.trip.id = p.id; s.expenses = structuredClone(p.expenses || []); s.docs = structuredClone(p.docs || {}); s.check = p.check ? structuredClone(p.check) : null; s.tab = 'plan'; s.banner = 'Opened "' + p.name + '".'; });
  researchAll(false);
  const m = document.getElementById('main'); if (m) m.scrollTop = 0;
}
function exportPlans() {
  const blob = new Blob([JSON.stringify({ app: 'trip-desk', version: 1, plans: S.plans, current: S.trip }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'trip-desk-plans.json' });
  document.body.append(a); a.click(); a.remove();
}
async function importPlans(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.plans)) throw new Error('Not a Trip Desk file');
    let added = 0;
    set((s) => { const ids = new Set(s.plans.map((p) => p.id)); j.plans.forEach((p) => { if (p && p.trip && !ids.has(p.id)) { s.plans.push(p); added++; } }); s.banner = 'Imported ' + added + ' trips.'; });
  } catch (e) { set((s) => { s.banner = 'Import failed: ' + e.message; }); }
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), clamp(2500 + msg.length * 40, 3500, 9000));
}
document.getElementById('toast').addEventListener('click', (e) => e.currentTarget.classList.remove('on'));

/* ---------- install ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false; render(); });
window.addEventListener('appinstalled', () => { installEvt = null; document.getElementById('install').hidden = true; set((s) => { s.banner = 'Trip Desk is installed. Open it from your home screen.'; }); });
async function installApp() {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; document.getElementById('install').hidden = true; return; }
  set((s) => { s.back = s.tab; s.tab = 'settings'; });
}
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
document.getElementById('install').addEventListener('click', installApp);

/* ---------- start ---------- */
// style B starts dark; after that the choice is yours (Dark, Day or Auto)
if (S.settings.themeV !== 2) { S.settings.theme = 'dark'; S.settings.themeV = 2; }
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
document.getElementById('themebtn').addEventListener('click', toggleTheme);
document.getElementById('gear').addEventListener('click', () => set((s) => { if (s.tab !== 'settings') s.back = s.tab; s.tab = 'settings'; }));
render();
ensureRates().then(render).catch(() => {});
if (S.trip.stops.some((s) => !s.geo || !(R[s.key] && R[s.key].voyage && R[s.key].voyage.v === VV))) researchAll(false);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // check for a new version on every open, and reload once when it takes over
  const hadSw = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSw && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => reg.update()).catch(() => {});
}
</script>
